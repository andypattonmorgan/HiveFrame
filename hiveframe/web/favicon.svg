<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>HiveFrame</title>
  <!-- The hive cell from the brand mark, hollowed into a frame.

       A ring rather than the solid hexagon the rail uses: at 16px a filled
       shape is a blob, and the outline keeps a silhouette you can pick out of
       a row of tabs.

       The dark rounded plate is there because a tab strip can be light or
       dark, and amber on white disappears.

       Colours are the app's accent and background, written as literals. An
       SVG loaded as a favicon gets no stylesheet, so a CSS variable would
       resolve to nothing. Note for anyone editing this comment: XML forbids a
       double hyphen inside a comment, and writing the token names here with
       their leading hyphens is what broke this file the first time. -->

  <rect width="32" height="32" rx="7" fill="#0f1115"/>
  <path fill="#f2b134" fill-rule="evenodd"
        d="M16 3 L28 9 L28 23 L16 29 L4 23 L4 9 Z
           M16 9.5 L22.5 12.75 L22.5 19.25 L16 22.5 L9.5 19.25 L9.5 12.75 Z"/>
</svg>
