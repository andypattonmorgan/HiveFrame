                body: JSON.stringify({ project: id, status, reason, store: "work" })
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "refused"); return; }
            await load(); draw(); loadLog();
        }

        async function loadLog() {
            const el = document.getElementById("dlog");
            if (!el) return;
            const r = await fetch("/api/log?name=decisions.jsonl");
            const rows = (await r.json()).rows || [];
            el.innerHTML = rows.length ? `<table>
    <tr><th>When</th><th>Project</th><th>Change</th><th>Reason</th></tr>
    ${rows.map(x => `<tr><td class="num">${x.at.slice(0, 16).replace("T", " ")}</td>
      <td>${x.name}</td><td>${x.from} to ${x.to}</td>
      <td class="why">${x.reason}</td></tr>`).join("")}</table>`
                : `<p class="empty">No decisions recorded yet.</p>`;
        }

        async function loadTree(id, force = false) {
            if (!id) return null;
            if (TREE[id] && !force) return TREE[id];
            const r = await fetch("/api/tree?scope=project&id=" + encodeURIComponent(id));
            const data = await r.json();
            TREE[id] = r.ok ? data
                : {
                    error: r.status === 404
                        ? "Tree endpoint not served. This HiveFrame process predates it; restart the server."
                        : (data.error || "tree unavailable")
                };
            if (VIEW === "project" && !FILE_DIRTY) draw();
            drawFiles();
            return TREE[id];
        }

        function treeLeaf(n) {
            const name = esc(n.name || n.path);
            const size = typeof n.size === "number" ? `<span class="why">${fsize(n.size)}</span>` : "";
            if (n.exists === false) return `<div class="tree-item"><span class="missing">${name}</span> <span class="gap">missing</span></div>`;
            /* Clicking opens the file here rather than in Finder. Leaving to
               another application to read one paragraph is the context switch
               this view exists to avoid. Finder moved to the preview header,
               because one Finder link per row is a lot of furniture for
               something used once a week. */
            const on = FILE && FILE.path === n.path ? " on" : "";
            return `<div class="tree-item${on}" title="${esc(n.path)}">
                <span class="lnk" onclick='openFile(${JSON.stringify(n.path)})'>${name}</span> ${size}
            </div>`;
        }


        function fsize(b) {
            if (b < 1024) return b + " B";
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
            return (b / 1024 / 1024).toFixed(1) + " MB";
        }

        function treeNode(n) {
            if (n.kind === "file") return treeLeaf(n);
            const children = (n.children || []).map(treeNode).join("") || `<div class="empty">Empty</div>`;
            const flags = [n.exists === false ? `<span class="gap">missing</span>` : "",
            n.truncated ? `<span class="gap">${n.hidden ? n.hidden + " more hidden" : "truncated"}</span>` : ""]
                .filter(Boolean).join(" ");
            /* A bare node drops its own summary row: the rail already names the
               root above it, and a folder you cannot collapse does not need a
               disclosure triangle. */
            if (n.bare) return `<div>${children}</div>`;
            return `<details class="tree-dir"${n.open ? " open" : ""}>
                <summary><span class="tree-name">${esc(n.name || n.path)}</span>${flags ? ` <span class="why">${flags}</span>` : ""}</summary>
                <div class="tree-children">${children}</div>
            </details>`;
        }

        /* Files the assistant changed during the last turn, and the files you
           have opened before. Both are per project, because a change in one
           project is not news while you are reading another. */
        let TOUCHED = {};
        const HIST_KEY = "hiveframe.filehistory", HIST_MAX = 25;
        let HISTORY = {};
        try { HISTORY = JSON.parse(localStorage.getItem(HIST_KEY) || "{}"); } catch (e) { HISTORY = {}; }

        function histAdd(path, label) {
            if (!SEL) return;
            const list = (HISTORY[SEL] || []).filter(e => e.path !== path);
            list.unshift({ path, label: label || path.split("/").pop() });
            HISTORY[SEL] = list.slice(0, HIST_MAX);
            try { localStorage.setItem(HIST_KEY, JSON.stringify(HISTORY)); } catch (e) { }
            drawHist();
        }

        function drawHist() {
            const sel = document.getElementById("fhist");
            if (!sel) return;
            const list = HISTORY[SEL] || [];
            /* Disabled rather than hidden. A control that appears only once it
               has content reads as a glitch the first time it shows up. */
            sel.disabled = !list.length;
            sel.innerHTML = `<option value="">${list.length ? "Recent" : "No history"}</option>` +
                list.map(e => `<option value="${esc(e.path)}" title="${esc(e.path)}">${esc(e.label)}</option>`).join("");
            sel.value = "";
        }

        /* mtime map of every file in the project, used to see what a chat turn
           wrote. The assistant edits through its own tools and does not report
           what it touched, so the file system is the only honest witness. */
        function mtimeMap(t) {
            const out = {};
            const walk = n => {
                if (!n) return;
                if (n.kind === "file") { if (n.mtime) out[n.path] = n.mtime; return; }
                (n.children || []).forEach(walk);
            };
            (t && t.roots || []).forEach(r => walk(r.tree));
            return out;
        }

        async function markChangedFiles(id, before) {
            if (!id) return;
            const t = await loadTree(id, true);
            const after = mtimeMap(t);
            const changed = Object.keys(after).filter(p => before[p] !== after[p]);
            if (!changed.length) return;
            TOUCHED[id] = changed;
            drawFiles();
            /* Open the change rather than only flagging it. A notice you have
               to go and act on is one more step between the edit and reading
               it. If several files changed, the first is opened and the rest
               stay marked. */
            if (id === SEL && !FILE_DIRTY) openFile(changed[0]);
        }

        /* The tree lives in the rail, so it renders into its own element rather
           than into the main view. It survives a tab change, which is the point:
           you can read a file while looking at Triage. */
        function drawFiles() {
            drawHist();
            const el = document.getElementById("ftree");
            if (!el) return;
            const id = SEL;
            if (!id) return el.innerHTML = `<p class="empty">No project selected.</p>`;
            const t = TREE[id];
            if (!t) { loadTree(id); return el.innerHTML = `<p class="empty">Loading…</p>`; }
            if (t.error) return el.innerHTML = `<p class="empty">${esc(t.error)}</p>`;
            const roots = t.roots || [];
            if (!roots.length) return el.innerHTML = `<p class="empty">No folder declared for this project.</p>`;
            el.innerHTML = roots.map(r => `
                <div class="rlabel">${esc(r.label)}</div>
                ${treeNode(Object.assign({ open: true, bare: true }, r.tree))}
            `).join("") + (t.note ? `<p class="empty">${esc(t.note)}</p>` : "");
            markTouched();
            markOpenFile();
        }

        /* Marks are applied after render rather than baked into the row, so
           clearing one does not rebuild the tree and collapse your folders. */
        function markTouched() {
            const set = new Set(TOUCHED[SEL] || []);
            document.querySelectorAll("#ftree .tree-item").forEach(el => {
                el.classList.toggle("touched", set.has(el.getAttribute("title")));
            });
            document.querySelectorAll("#ftree .tree-dir").forEach(d => {
                const hit = !!d.querySelector(".tree-item.touched");
                d.classList.toggle("hastouch", hit);
                /* A change inside a folder you have closed is a change you will
                   not see, so open the path to it. */
                if (hit) d.open = true;
            });
        }



        /* ---- preview panel: open, read, edit, save ----
           Read and write go through the server, which allows only paths inside
           a folder this board already declares. The browser sends a path; it
           does not get to choose what counts as reachable.

           The panel is a sibling of the main column, not a card inside it, so
           opening a file does not push the project you were reading off the
           screen. That was the first version and it was the wrong shape: a
           preview that displaces the thing it is previewing for. */
        let FILE = null, FILE_DIRTY = false, FILE_SRC = false;

        async function openFile(path) {
            if (FILE_DIRTY && !confirm("Unsaved changes will be lost. Open anyway?")) return;
            FILE = { path, loading: true }; FILE_DIRTY = false; FILE_SRC = false;
            /* Opening it is reading it, so the mark has done its job. */
            if (SEL && TOUCHED[SEL]) {
                TOUCHED[SEL] = TOUCHED[SEL].filter(p => p !== path);
                markTouched();
            }
            showPrev(true); drawPrev();
            const r = await fetch("/api/file?path=" + encodeURIComponent(path));
            const d = await r.json();
            FILE = r.ok ? d : { path, error: d.error || "could not open" };
            if (r.ok) histAdd(path, d.rel || d.name);
            drawPrev();
        }


        function closeFile() {
            if (FILE_DIRTY && !confirm("Unsaved changes will be lost. Close anyway?")) return;
            FILE = null; FILE_DIRTY = false; showPrev(false); drawPrev();
        }

        /* The panel takes width only while something is in it. An empty third
           of the screen is worse than no panel. */
        function showPrev(on) {
            const app = document.getElementById("app");
            app.classList.toggle("noprev", !on);
            /* An inline custom property outranks the .noprev class rule, so
               closing has to remove it rather than rely on the class. */
            if (on) app.style.setProperty("--w-prev", (LAYOUT.prev || 560) + "px");
            else app.style.removeProperty("--w-prev");
        }

        function fileDirty() {
            if (FILE_DIRTY) return;
            FILE_DIRTY = true;
            const s = document.getElementById("fstate");
            if (s) { s.textContent = "unsaved changes"; s.className = "gap"; }
        }

        function toggleSource() { FILE_SRC = !FILE_SRC; drawPrev(); }

        /* Highlight the open file without re-rendering the tree, which would
           collapse every folder you had opened to get there. */
        function markOpenFile() {
            const want = FILE && FILE.path ? FILE.path : null;
            document.querySelectorAll("#ftree .tree-item").forEach(el => {
                el.classList.toggle("on", !!want && el.getAttribute("title") === want);
            });
        }


        async function saveFile() {
            const ta = document.getElementById("fedit");
            if (!ta || !FILE) return;
            const s = document.getElementById("fstate");
            if (s) { s.textContent = "saving…"; s.className = "why"; }
            const r = await fetch("/api/file", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: FILE.path, text: ta.value })
            });
            const d = await r.json();
            if (!r.ok) { if (s) { s.textContent = d.error || "save refused"; s.className = "missing"; } return; }
            FILE.text = ta.value; FILE.size = d.bytes; FILE_DIRTY = false;
            if (s) { s.textContent = "saved, " + fsize(d.bytes) + ", previous version kept as .bak"; s.className = "why"; }
            /* A project file that was just edited is the board. Reload it, or
               the screen and the file disagree until the next refresh. */
            if (FILE.path.endsWith(".toml")) await load();
        }

        function drawPrev() {
            const el = document.getElementById("prev");
            markOpenFile();
            if (!FILE) { el.innerHTML = ""; return; }

            const raw = "/api/raw?path=" + encodeURIComponent(FILE.path);
            const isMd = /\.md$/i.test(FILE.path);
            const canRender = (isMd || FILE.kind === "html") && FILE.editable;

            const head = `<div class="fhead">
      <span class="fname" title="${esc(FILE.path)}">${esc(FILE.rel || FILE.name || FILE.path)}</span>
      ${canRender ? `<button class="sm" onclick="toggleSource()">${FILE_SRC ? "Preview" : "Edit"}</button>` : ""}
      ${FILE.editable && (FILE_SRC || !canRender) ? `<button class="sm pri" onclick="saveFile()">Save</button>` : ""}
      <button class="sm" onclick='reveal(${JSON.stringify(FILE.path)})'>Finder</button>
      <button class="sm" onclick="closeFile()">Close</button>
    </div>`;

            const foot = `<div class="ffoot"><span id="fstate" class="why">${fsize(FILE.size || 0)}</span></div>`;

            if (FILE.loading) return void (el.innerHTML = `<div class="fhead"><span class="fname">Opening…</span></div>`);
            if (FILE.error) return void (el.innerHTML = head + `<div class="fempty">${esc(FILE.error)}</div>`);

            let body;
            if (FILE.kind === "pdf") {
                body = `<iframe src="${raw}" title="${esc(FILE.name)}"></iframe>`;
            } else if (FILE.kind === "image") {
                body = `<div class="fread" style="max-width:none"><img src="${raw}" alt="${esc(FILE.name)}"></div>`;
            } else if (!FILE.editable) {
                /* Office formats and anything else the browser cannot render.
                   Saying so plainly and offering the real application beats a
                   blank frame that looks broken. */
                body = `<div class="fempty">${esc(FILE.reason || "cannot be shown here")}.
          ${fsize(FILE.size || 0)}.<br><br>
          <button class="sm" onclick='reveal(${JSON.stringify(FILE.path)})'>Show in Finder</button></div>`;
            } else if (canRender && !FILE_SRC) {
                body = isMd
                    ? `<div class="fread">${md(FILE.text)}</div>`
                    : `<iframe src="${raw}" title="${esc(FILE.name)}" sandbox="allow-same-origin"></iframe>`;
            } else {
                body = `<textarea class="fedit" id="fedit" spellcheck="false" oninput="fileDirty()">${esc(FILE.text)}</textarea>`;
            }
            el.innerHTML = head + `<div class="fbody2">${body}</div>` + foot;
            const ta = document.getElementById("fedit");
            if (ta && FILE_SRC) ta.focus();
        }

        function projectView() {
            const p = proj(SEL);
            if (!p) return `<p class="empty">No projects. Add a .toml file to the projects directory.</p>`;
            const c = p.charter;
            const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
            numberTasks(p);

            /* Charter fields are editable in place. The charter is the thing that stops
               drift, so making it hard to correct guarantees it goes stale and stops
               being believed. */
            const crow = (k, label, v) => `
    <div class="crow"><span class="ck">${label}</span>
      <span>${EDIT
                    ? `<textarea class="ed" data-charter="${k}">${esc(v)}</textarea>`
                    : (v ? esc(v) : '<span class="gap">not stated</span>')}</span></div>`;

            const otherIds = BOARD.projects.filter(x => x.id !== p.id).map(x => x.id);

            return `
  <h1>${p.name}</h1>
  <p class="lede">${p.tier || "project"} · ${p.kind} ·
     <span title="${HZ_MEANS[p.horizon] || ""}">${p.horizon || "no horizon set"}</span> · ${p.status} ·
     priority ${p.score} <span class="why">(${p.why.join("; ") || "nothing pushing it up"})</span></p>

  <div class="card charter">
    <h2>Why this exists${c.complete ? "" : ' <span class="gap">&nbsp;unfinished</span>'}
      <span class="toolbar">
        ${EDIT ? `<button class="sm pri" onclick="saveCharter()">Save</button>
                <button class="sm" onclick="setEdit(false)">Cancel</button>`
                    : `<button class="sm" onclick="setEdit(true)">Edit</button>`}
      </span></h2>
    <p class="hint">Five plain answers. If they cannot be written, the work has not
       been agreed yet.</p>
    ${crow("problem", fieldLabel("problem"), c.problem)}
    ${crow("hypothesis", fieldLabel("hypothesis"), c.hypothesis)}
    ${crow("goal", fieldLabel("goal"), c.goal)}
    ${crow("kill_when", fieldLabel("kill_when"), c.kill_when)}
    ${crow("done_when", fieldLabel("done_when"), c.done_when)}
    ${c.stop_when || (EDIT && p.tier === "program") ? crow("stop_when", fieldLabel("stop_when"), c.stop_when) : ""}
    ${EDIT
                    ? `<div class="crow"><span class="ck">${fieldLabel("constraints")}</span>
          <span><textarea class="ed" data-charter="constraints"
            placeholder="One per line">${esc(c.constraints.join("\n"))}</textarea></span></div>`
                    : (c.constraints.length ? `<div class="crow"><span class="ck">${fieldLabel("constraints")}</span>
          <span>${esc(c.constraints.join(", "))}</span></div>` : "")}
    ${EDIT ? `<p class="hint">Saving rewrites the project file and keeps a backup copy.
       Notes written as comments in the file are lost, so keep them in the fields.</p>`: ""}
  </div>

  <div class="card">
    <h2>Next moves<span class="toolbar">
      <button class="sm" onclick="focusProject()" title="Point the focus timer at this project">Focus project</button>
      <button class="sm" onclick="toggleAdd()">Add</button></span></h2>

    <div id="addbox" style="display:none;margin-bottom:14px">
      <input class="ed" id="nt-title" placeholder="What is the move? Be specific enough to start.">
      <div class="grid2" style="margin-top:7px">
        <input class="ed" id="nt-due" type="date">
        <input class="ed" id="nt-effort" type="number" step="0.25" min="0" placeholder="Effort, hours">
        <label class="fl"><input type="checkbox" id="nt-urgent"> urgent</label>
        <label class="fl"><input type="checkbox" id="nt-important"> important</label>
      </div>
      <input class="ed" id="nt-note" placeholder="Note, optional. Why this matters." style="margin-top:7px">
      <div class="vrow"><button class="sm pri" onclick="addTask()">Add</button>
        <button class="sm" onclick="toggleAdd()">Cancel</button></div>
    </div>

    ${p.tasks.length ? `<table>
      <tr><th>#</th><th>Move</th><th>Due</th><th>Days left</th><th>Hours</th><th>Flags</th><th>Status</th><th></th></tr>
      ${p.tasks.map(t => `<tr>
        <td class="num tnum">${TNUM[t.id] || ""}</td>
        <td>${esc(t.title)}${liveBlockers(t).length ? ` <span class="chip" style="background:var(--stop)">waiting on ${liveBlockers(t).map(b => "#" + TNUM[b]).join(", ")}</span>` : ""}
          ${t.note ? `<div class="why">${esc(t.note)}</div>` : ""}</td>
        <td class="num">${t.due || "<span class='why'>none</span>"}</td>
        <td class="num ${t.days_left !== null && t.days_left < 0 ? "missing" : ""}">${t.days_left === null ? "" : t.days_left + "d"}</td>
        <td class="num">${t.effort_h ? t.effort_h + "h" : ""}</td>
        <td>${t.urgent ? '<span class="chip" style="background:var(--stop)">urgent</span>' : ""}
            ${t.important ? '<span class="chip" style="background:var(--warn)">important</span>' : ""}</td>
        <td>${t.status === "open" || t.status === "doing"
                            ? `<select class="ed" style="width:auto;padding:3px 6px"
              onchange="taskField('${t.id}','status',this.value)">
              ${["open", "doing", "done"].map(s => `<option${t.status === s ? " selected" : ""}>${s}</option>`).join("")}
            </select>`
                            : esc(t.status)}</td>
        <td>${t.status === "open" || t.status === "doing"
                            ? `<button class="vb" onclick="focusTask('${t.id}')" title="Point the focus timer at this">Focus</button>
               <button class="vb" onclick="briefTask('${t.id}')" title="Load a draft instruction into chat">Ask</button>
               <button class="vb kill" onclick="dropTask('${t.id}')">Drop</button>` : ""}</td>
      </tr>`).join("")}
    </table>
    <p class="hint">Dropping asks for a reason and keeps the record. Deleting would
       remove the hours too, and make the workload look lighter than it is.</p>`
                    : `<p class="empty">No moves listed. Work with no next move is work that is not moving.</p>`}
  </div>

  <div class="card">
    <h2>Deliverables<span class="toolbar">
      <button class="sm" onclick="toggleArt()">Add</button></span></h2>

    <div id="artbox" style="display:none;margin-bottom:14px">
      <input class="ed" id="na-label" placeholder="What is it called">
      <div class="grid2" style="margin-top:7px">
        <input class="ed" id="na-path" placeholder="Where it lives on disk, optional">
        <input class="ed" id="na-kind" placeholder="Type: doc, tool, page, data" value="doc">
      </div>
      <div class="vrow"><button class="sm pri" onclick="addArtifact()">Add</button>
        <button class="sm" onclick="toggleArt()">Cancel</button></div>
    </div>

    ${p.artifacts.length ? `<table>
      <tr><th>Deliverable</th><th>Type</th><th>Where</th></tr>
      ${p.artifacts.map(a => `<tr>
        <td>${esc(a.label)}${a.exists || !a.path ? "" : ' <span class="chip" style="background:var(--stop)">not found</span>'}</td>
        <td>${esc(a.kind)}</td>
        <td>${a.path ? `<span class="lnk" onclick="reveal('${a.path.replace(/'/g, "\\'")}')">Reveal in Finder</span>
              <div class="mono">${esc(a.path)}</div>` : ""}
            ${a.url ? `<a class="lnk" href="${a.url}" target="_blank">Open published</a>` : ""}</td>
      </tr>`).join("")}
    </table>`: `<p class="empty">Nothing listed yet.</p>`}
  </div>

  <div class="card">
    <h2>Links to other work<span class="toolbar">
      <button class="sm" onclick="toggleRel()">Add link</button></span></h2>

    <div id="relbox" style="display:none;margin-bottom:14px">
      <div class="grid2">
        <select class="ed" id="nr-to">
          ${otherIds.map(i => `<option value="${i}">${i}</option>`).join("")}
        </select>
        <select class="ed" id="nr-type">
          ${["blocks", "blocked_by", "feeds", "governs", "governed_by", "hosts", "informs"]
                    .map(t => `<option>${t}</option>`).join("")}
        </select>
      </div>
      <input class="ed" id="nr-note" placeholder="Why. A link with no reason cannot be judged later." style="margin-top:7px">
      <div class="vrow"><button class="sm pri" onclick="addRelation()">Add</button>
        <button class="sm" onclick="toggleRel()">Cancel</button></div>
    </div>

    ${p.relations.length ? `<table>
      <tr><th>To</th><th>Type</th><th>Status</th><th>Why</th><th></th></tr>
      ${p.relations.map(r => `<tr>
        <td><span class="lnk" onclick="pick('${r.to}')">${r.to}</span></td>
        <td>${esc(r.type)}</td>
        <td>${r.status === "confirmed"
                            ? '<span class="chip" style="background:var(--ok)">confirmed</span>'
                            : r.status === "rejected"
                                ? '<span class="chip" style="background:var(--faint)">rejected</span>'
                                : '<span class="chip" style="background:var(--info)">suggested</span>'}</td>
        <td class="why">${esc(r.note)}</td>
        <td>${r.status === "suggested" ? `
          <button class="vb" onclick="relVerdict('${r.to}','confirmed')">Confirm</button>
          <button class="vb" onclick="relVerdict('${r.to}','rejected')">Reject</button>` : ""}</td>
      </tr>`).join("")}
    </table>
    <p class="hint">A suggested link changes nothing until it is confirmed. Rejected ones
       stay on the record, so the same suggestion does not come back next month
       looking new.</p>`
                    : `<p class="empty">No links recorded. Nothing is connected unless it says so here.</p>`}
  </div>

  <div class="card">
    <h2>Depends on<span class="toolbar">
      <button class="sm" onclick="toggleUses()">Change</button></span></h2>

    <div id="usesbox" style="display:none;margin-bottom:14px">
      <div class="grid2">
        ${(BOARD.tools || []).map(t => `<label class="fl">
          <input type="checkbox" class="use-ck" value="${t.id}"${p.uses.includes(t.id) ? " checked" : ""}>
          ${t.id}</label>`).join("")}
      </div>
      <div class="vrow"><button class="sm pri" onclick="saveUses()">Save</button>
        <button class="sm" onclick="toggleUses()">Cancel</button></div>
    </div>

    ${p.uses.length ? `<table>
      <tr><th>Tool</th><th>What it does</th><th>Where</th></tr>
      ${p.uses.map(id => {
                        const t = (BOARD.tools || []).find(x => x.id === id);
                        return `<tr><td>${id}</td>
          <td class="why">${t ? esc(t.does) || "<span class='gap'>undescribed</span>"
                                : "<span class='gap'>not in the registry</span>"}</td>
          <td class="why">${t ? esc(t.where) : ""}</td></tr>`;
                    }).join("")}
    </table>
    <p class="hint">Tools are referenced, not owned. They are used by this project
       and are not limited to it.</p>`
                    : `<p class="empty">No declared tool dependencies.</p>`}
  </div>
`;
        }


        function toggleUses() {
            const b = document.getElementById("usesbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }
        async function saveUses() {
            const ids = [...document.querySelectorAll(".use-ck")].filter(c => c.checked).map(c => c.value);
            await api({ action: "uses", fields: { uses: ids } });
        }

        /* ---- edit plumbing ---- */
        let EDIT = false;
        function setEdit(on) { EDIT = on; draw(); }
        function toggleAdd() {
            const b = document.getElementById("addbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
            if (b.style.display === "block") document.getElementById("nt-title").focus();
        }
        function toggleArt() {
            const b = document.getElementById("artbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }
        function toggleRel() {
            const b = document.getElementById("relbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }

        async function api(body) {
            const r = await fetch("/api/edit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.assign({ store: "work", project: SEL }, body))
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "refused"); return false; }
            await load(); draw();
            return true;
        }

        async function saveCharter() {
            const f = {};
            document.querySelectorAll("[data-charter]").forEach(el => f[el.dataset.charter] = el.value);
            EDIT = false;
            await api({ action: "charter", fields: f });
        }
        async function addTask() {
            const v = id => document.getElementById(id).value;
            const ck = id => document.getElementById(id).checked;
            await api({
                action: "task.add", fields: {
                    title: v("nt-title"), due: v("nt-due"),
                    effort_h: v("nt-effort"), urgent: ck("nt-urgent"), important: ck("nt-important"),
                    note: v("nt-note")
                }
            });
        }
        async function taskField(id, k, v) { await api({ action: "task.edit", task: id, fields: { [k]: v } }); }
        async function dropTask(id) {
            const why = prompt("Why is this task dropped? It stays on the record with the reason.");
            if (why === null) return;
            await api({ action: "task.drop", task: id, reason: why });
        }
        async function addArtifact() {
            const v = id => document.getElementById(id).value;
            await api({ action: "artifact.add", fields: { label: v("na-label"), path: v("na-path"), kind: v("na-kind") } });
        }
        async function addRelation() {
            const v = id => document.getElementById(id).value;
            await api({ action: "relation.add", to: v("nr-to"), type: v("nr-type"), note: v("nr-note") });
        }
        async function relVerdict(to, verdict) { await api({ action: "relation.verdict", to, verdict }); }

        function briefView() {
            const top = BOARD.projects.slice(0, 5), bottom = BOARD.projects.slice(-5).reverse();
            const c = BOARD.capacity;
            const flags = [];
            c.at_risk.forEach(r => flags.push(["var(--stop)",
                `<b>${r.title}</b> needs ${r.effort_h}h and only ${r.hours_available}h are free before it is due on ${r.due}`]));
            if (c.overcommitted) flags.push(["var(--stop)",
                `More work is committed than there are hours to do it, by ${c.overcommitted_by_h}h over the next ${c.window_days} days. Something has to give.`]);
            BOARD.projects.forEach(p => {
                p.relations.filter(r => r.status === "suggested").forEach(r =>
                    flags.push(["var(--info)", `<b>${p.name}</b> may be linked to ${r.to}. Confirm it or dismiss it.`]));
                if (!p.charter.complete && p.status === "active")
                    flags.push(["var(--warn)",
                        `<b>${p.name}</b> has not answered: ${p.charter.missing.map(fieldLabel).join(", ")}`]);
            });

            return `
  <h1>Brief</h1>
  <p class="lede">The five to push and the five to decide about. One decision each,
     then stop.</p>

  <div class="card"><h2>Needs attention</h2>
    ${flags.length ? flags.map(([col, txt]) =>
                `<div class="flag"><i class="b" style="background:${col}"></i><span>${txt}</span></div>`).join("")
                    : `<p class="empty">Nothing needs attention.</p>`}</div>

  <div class="card"><h2>Top 5, do these</h2>
    <table><tr><th>Project</th><th>Priority</th><th>Why it is near the top</th></tr>
    ${top.map(p => `<tr><td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span></td>
      <td class="num">${p.score}</td><td class="why">${p.why.join("; ") || "nothing pushing it up"}</td></tr>`).join("")}
    </table></div>

  <div class="card"><h2>Bottom 5, decide about these</h2>
    <table><tr><th>Project</th><th>Priority</th><th>Why it dropped</th></tr>
    ${bottom.map(p => `<tr><td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span></td>
      <td class="num">${p.score}</td><td class="why">${p.why.join("; ") || "nothing pushing it up"}</td></tr>`).join("")}
    </table>
    <p class="why" style="margin:10px 0 0">Stop it, pause it with a reason, or give it a
       date. Leaving it alone is not one of the three.</p>
  </div>`;
        }

        function capView() {
            const c = BOARD.capacity;
            return `
  <h1>Capacity</h1>
  <p class="lede">The hours in the week against the hours already promised. Estimates
     start out wrong; timed work sessions correct them.</p>
  <div class="card"><div class="bars">
    <div class="stat"><div class="k">Hours free</div><div class="v">${c.available_h}h</div>
      <div class="n">${c.weekly_hours}h a week over the next ${c.window_days} days${c.operations_h ? `, less ${c.operations_h}h of routine running work` : ""}</div></div>
    <div class="stat"><div class="k">Hours promised</div><div class="v">${c.committed_h}h</div>
      <div class="n">work with a date in this window</div></div>
    <div class="stat"><div class="k">Not yet scheduled</div><div class="v">${c.undated_h}h</div>
      <div class="n">no date set, so it is not in the forecast</div></div>
    <div class="stat"><div class="k">Over-promised</div>
      <div class="v" style="color:${c.overcommitted ? "var(--stop)" : "var(--ok)"}">${c.overcommitted ? c.overcommitted_by_h + "h" : "no"}</div>
      <div class="n">${c.overcommitted ? "something has to be cut" : "it fits, on today's estimates"}</div></div>
  </div></div>
  <div class="card"><h2>At risk of missing its date</h2>
    ${c.at_risk.length ? `<table>
      <tr><th>Move</th><th>Project</th><th>Due</th><th>Days left</th><th>Hours needed</th><th>Hours free</th></tr>
      ${c.at_risk.map(r => `<tr><td>${r.title}</td>
        <td><span class="lnk" onclick="pick('${r.project}')">${r.project_name}</span></td>
        <td class="num">${r.due}</td><td class="num">${r.days_left}d</td>
        <td class="num">${r.effort_h}h</td>
        <td class="num missing">${r.hours_available}h</td></tr>`).join("")}
      </table>`: `<p class="empty">Nothing is at risk on today's estimates.</p>`}
  </div>`;
        }

        function reveal(p) { fetch("/api/open?path=" + encodeURIComponent(p)); }

        /* ---- focus timer: picking is part of the tool ---- */
        let LEN = 25 * 60, left = LEN, tick = null, task = null;

        function drawCandidates() {
            const out = [];
            BOARD.projects.slice(0, 3).forEach(p => {
                /* Never offer a task that is waiting on a sibling. A candidate you cannot
                   start is worse than no candidate: it costs a decision and returns nothing. */
                const openIds = new Set(p.tasks.filter(x => x.status === "open" || x.status === "doing").map(x => x.id));
                const t = p.tasks.find(x => (x.status === "open" || x.status === "doing")
                    && !(x.blocked_by || []).some(d => openIds.has(d)));
                if (t) out.push({ p, t });
            });
            document.getElementById("cands").innerHTML = out.length ? out.map((c, i) => `
    <div class="cand" onclick="setTask(${i})">
      <div class="t">${c.t.title}</div>
      <div class="r">${c.p.name} · ${c.p.why[0] || "ranked highest"}</div>
    </div>`).join("") : `<div class="why">No open tasks to offer.</div>`;
            window._CANDS = out;
        }
        function setTask(i) {
            const c = window._CANDS[i]; task = c;
            document.getElementById("ctx").textContent = c.t.title + " · " + c.p.name;
            if (c.p.id !== SEL) pick(c.p.id);
        }

        /* Focus anything, not only what was offered.
           The three candidates are a suggestion from the ranking, and the
           ranking does not know what you were just asked to do in a corridor.
           A timer you cannot point at the real thing gets used once. */
        function focusTask(id) {
            const p = proj(SEL);
            const t = (p.tasks || []).find(x => x.id === id);
            if (!t) return;
            task = { p, t };
            document.getElementById("ctx").textContent = t.title + " · " + p.name;
            document.getElementById("cands").innerHTML =
                `<div class="why">Focused by hand. <span class="lnk" onclick="drawCandidates()">Show suggestions</span></div>`;
        }

        /* A project rather than a task, for work that has no card yet. Captures
           file under the project with no task id, which is honest: it says the
           hour went here without inventing a task to hang it on. */
        function focusProject() {
            const p = proj(SEL);
            if (!p) return;
            task = { p, t: { id: "", title: p.name } };
            document.getElementById("ctx").textContent = p.name + " · whole project";
            document.getElementById("cands").innerHTML =
                `<div class="why">Focused by hand. <span class="lnk" onclick="drawCandidates()">Show suggestions</span></div>`;
        }

        function fmt(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
        function paint() { document.getElementById("clock").textContent = fmt(left); }
        document.getElementById("go").onclick = () => {
            const b = document.getElementById("go");
            if (tick) { clearInterval(tick); tick = null; b.textContent = "Resume"; return; }
            b.textContent = "Pause";
            tick = setInterval(() => {
                left--; paint();
                if (left <= 0) {
                    clearInterval(tick); tick = null; left = LEN; paint();
                    b.textContent = "Start"; document.getElementById("ctx").textContent = "Block done.";
                }
            }, 1000);
        };
        document.getElementById("reset").onclick = () => {
            if (tick) clearInterval(tick); tick = null; left = LEN; paint();
            document.getElementById("go").textContent = "Start";
        };
        document.getElementById("fold").onclick = () => {
            const f = document.getElementById("focus");
            f.classList.toggle("collapsed");
            document.getElementById("fold").textContent = f.classList.contains("collapsed") ? "+" : "-";
        };

        /* ---- moving the focus panel ----
           It floats over the page, so wherever it is parked it is in front of
           something. Three answers, in order of how far you want it to go:
           drag it, pop it into its own always-on-top window, or put it back.

           Dragging writes left and top and clears the bottom anchor, because a
           panel pinned to two opposite edges cannot move. The spot is saved,
           and clamped on load, so a panel dragged to a corner of a wide display
           does not come back off-screen on a laptop. */
        const SPOT_KEY = "hiveframe.focusspot";

        function placeFocus(x, y) {
            const f = document.getElementById("focus");
            const w = f.offsetWidth || 274, h = f.offsetHeight || 200;
            x = Math.min(Math.max(0, x), Math.max(0, innerWidth - w));
            y = Math.min(Math.max(0, y), Math.max(0, innerHeight - h));
            f.style.left = x + "px";
            f.style.top = y + "px";
            f.style.bottom = "auto";
            return { x, y };
        }

        function loadSpot() {
            try {
                const s = JSON.parse(localStorage.getItem(SPOT_KEY) || "null");
                if (s) placeFocus(s.x, s.y);
            } catch (e) { }
        }

        function homeFocus() {
            const f = document.getElementById("focus");
            f.style.left = "16px"; f.style.top = "auto"; f.style.bottom = "16px";
            try { localStorage.removeItem(SPOT_KEY); } catch (e) { }
        }
        document.getElementById("fhome").onclick = homeFocus;

        document.getElementById("fdrag").addEventListener("pointerdown", ev => {
            /* Not from a button. The header carries three of them. */
            if (ev.target.closest("button")) return;
            const f = document.getElementById("focus");
            const g = ev.currentTarget;
            const r = f.getBoundingClientRect();
            const dx = ev.clientX - r.left, dy = ev.clientY - r.top;
            g.classList.add("dragging");
            g.setPointerCapture(ev.pointerId);
            const move = e => placeFocus(e.clientX - dx, e.clientY - dy);
            const up = e => {
                g.releasePointerCapture(ev.pointerId);
                g.classList.remove("dragging");
                g.removeEventListener("pointermove", move);
                g.removeEventListener("pointerup", up);
                const at = placeFocus(e.clientX - dx, e.clientY - dy);
                try { localStorage.setItem(SPOT_KEY, JSON.stringify(at)); } catch (e2) { }
            };
            g.addEventListener("pointermove", move);
            g.addEventListener("pointerup", up);
            ev.preventDefault();
        });

        /* Pop out moves the node itself into a document picture-in-picture
           window, which floats above other applications. The node moves rather
           than being copied, so the timer keeps running and every handler keeps
           working; a copy would need its own state and the two would drift.
           Closing the window moves it straight back.

           Feature-detected. Where the browser does not support it the button is
           removed rather than left to fail on click. */
        async function popFocus() {
            if (!window.documentPictureInPicture) return;
            const f = document.getElementById("focus");
            const w = await documentPictureInPicture.requestWindow({ width: 300, height: 420 });
            [...document.styleSheets].forEach(ss => {
                try {
                    const css = [...ss.cssRules].map(r => r.cssText).join("");
                    const el = w.document.createElement("style");
                    el.textContent = css;
                    w.document.head.appendChild(el);
                } catch (e) { /* cross-origin sheet, nothing to copy */ }
            });
            w.document.body.classList.add("pip");
            w.document.body.appendChild(f);
            w.addEventListener("pagehide", () => {
                document.body.appendChild(f);
                homeFocus();
                loadSpot();
            });
        }

        if (window.documentPictureInPicture) document.getElementById("fpop").onclick = popFocus;
        else document.getElementById("fpop").remove();

        loadSpot();
        /* A window resized smaller can leave the panel outside it. */
        addEventListener("resize", loadSpot);
        document.getElementById("capture").addEventListener("keydown", async e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                const v = e.target.value.trim(); if (!v) return;
                /* Persist it. A capture box that discards what you typed teaches you not
                   to use it, and then the thought goes back into working memory. */
                const r = await fetch("/api/capture", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: v, store: "work",
                        project: task ? task.p.id : "", task: task ? task.t.id : ""
                    })
                });
                if (!r.ok) { e.target.placeholder = "Not saved. Try again."; return; }
                e.target.value = ""; e.target.placeholder = "Parked in inbox.jsonl. Keep going.";
                setTimeout(() => e.target.placeholder = "Park the thought here", 2500);
            }
        });

        document.querySelectorAll(".tab[data-v]").forEach(b => b.onclick = () => setView(b.dataset.v));

        document.getElementById("ftreerefresh").onclick = () => { if (SEL) loadTree(SEL, true); };

        /* ---- message box height ----
           A three-line box is right for a question and wrong for a drafted task
           instruction, which is the thing the Ask button now puts in it. Dragged
           up, not auto-grown: an input that resizes itself while you type moves
           the text under the cursor.

           Height is saved, and clamped on load, so a box dragged tall on a big
           display does not swallow the conversation on a laptop. */
        const CBOX_KEY = "hiveframe.promptheight";
        const CBOX_MIN = 54;

        function setPromptH(px) {
            const box = document.getElementById("cprompt");
            const max = Math.max(CBOX_MIN, innerHeight - 260);
            const h = Math.min(max, Math.max(CBOX_MIN, px));
            box.style.height = h + "px";
            return h;
        }

        try {
            const s = parseInt(localStorage.getItem(CBOX_KEY) || "", 10);
            if (s) setPromptH(s);
        } catch (e) { }

        document.getElementById("cgrip").addEventListener("pointerdown", ev => {
            const g = ev.currentTarget;
            const box = document.getElementById("cprompt");
            const start = ev.clientY;
            const from = box.getBoundingClientRect().height;
            g.classList.add("dragging");
            document.body.classList.add("rowdrag");
            g.setPointerCapture(ev.pointerId);
            /* Up is bigger, because the box grows against the conversation
               above it rather than off the bottom of the window. */
            const move = e => setPromptH(from - (e.clientY - start));
            const up = e => {
                g.releasePointerCapture(ev.pointerId);
                g.classList.remove("dragging");
                document.body.classList.remove("rowdrag");
                g.removeEventListener("pointermove", move);
                g.removeEventListener("pointerup", up);
                const h = setPromptH(from - (e.clientY - start));
                try { localStorage.setItem(CBOX_KEY, String(h)); } catch (e2) { }
            };
            g.addEventListener("pointermove", move);
            g.addEventListener("pointerup", up);
            ev.preventDefault();
        });


        document.getElementById("fhist").onchange = e => {
            const p = e.target.value;
            e.target.value = "";
            if (p) openFile(p);
        };


        /* Chat controls are bound once, because the rail is markup rather than a
           re-rendered string. That is most of the reason it is a rail. */
        document.getElementById("csend").onclick = sendChat;
        document.getElementById("cstop").onclick = stopChat;
        document.getElementById("cprompt").addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });
        document.getElementById("cnew").onclick = async () => {
            await fetch("/api/chat", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reset: true, store: "work", project: SEL || "" })
            });
            if (CHAT) CHAT.session = "";
            document.getElementById("cscroll").innerHTML =
                `<p class="empty">Fresh thread. The previous one is still resumable from the terminal.</p>`;
            paintCtx();
        };
        document.getElementById("chattoggle").onclick = () => {
            document.querySelector(".app").classList.toggle("nochat");
            saveLayout();
        };

        /* ---- resizable panels ----
           Column widths live in CSS variables, so a drag writes one property
           and the browser does the rest. They are saved, because a layout you
           have to rebuild every morning is one you stop adjusting.

           Minimums are enforced here rather than in CSS: a panel dragged to
           40px is not a small panel, it is a panel you have lost, and the
           handle to recover it is 40px wide. */
        const LAYOUT_KEY = "hiveframe.layout";
        const LIMITS = { rail: [200, 460], prev: [320, 1100], chat: [300, 720] };
        let LAYOUT = { rail: 290, prev: 560, chat: 380, chatOpen: true };

        function applyLayout() {
            const app = document.getElementById("app");
            app.style.setProperty("--w-rail", LAYOUT.rail + "px");
            app.style.setProperty("--w-chat", LAYOUT.chat + "px");
            if (!app.classList.contains("noprev"))
                app.style.setProperty("--w-prev", LAYOUT.prev + "px");
            app.classList.toggle("nochat", !LAYOUT.chatOpen);
        }

        function saveLayout() {
            LAYOUT.chatOpen = !document.getElementById("app").classList.contains("nochat");
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(LAYOUT)); } catch (e) { }
        }

        function loadLayout() {
            try {
                const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
                ["rail", "prev", "chat"].forEach(k => {
                    if (typeof s[k] === "number") {
                        const [lo, hi] = LIMITS[k];
                        LAYOUT[k] = Math.min(hi, Math.max(lo, s[k]));
                    }
                });
                if (typeof s.chatOpen === "boolean") LAYOUT.chatOpen = s.chatOpen;
            } catch (e) { }
            applyLayout();
        }

        document.querySelectorAll(".gutter").forEach(g => {
            g.addEventListener("pointerdown", ev => {
                const key = g.dataset.drag;
                const app = document.getElementById("app");
                const start = ev.clientX;
                const from = LAYOUT[key];
                /* The rail grows to the right, the other two grow to the left,
                   because they sit on the far side of the handle. */
                const dir = key === "rail" ? 1 : -1;
                const [lo, hi] = LIMITS[key];

                g.classList.add("dragging");
                document.body.classList.add("dragging");
                g.setPointerCapture(ev.pointerId);

                const move = e => {
                    const w = Math.min(hi, Math.max(lo, from + dir * (e.clientX - start)));
                    LAYOUT[key] = w;
                    app.style.setProperty("--w-" + key, w + "px");
                };
                const up = e => {
                    g.releasePointerCapture(ev.pointerId);
                    g.classList.remove("dragging");
                    document.body.classList.remove("dragging");
                    g.removeEventListener("pointermove", move);
                    g.removeEventListener("pointerup", up);
                    saveLayout();
                };
                g.addEventListener("pointermove", move);
                g.addEventListener("pointerup", up);
                ev.preventDefault();
            });
        });

        loadLayout();
        paint(); load(); loadChat();
    </script>
</body>

</html>
