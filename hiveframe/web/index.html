                aEl.textContent = "Could not reach HiveFrame: " + e;
                chatBusy(false);
                setChatBusy(null);
                return;
            }

            const reader = r.body.getReader();
            const dec = new TextDecoder();
            let buf = "";

            const handle = d => {
                if (d.type === "turn") { RUN = d.id; return; }
                if (d.type === "error") {
                    aEl.textContent = d.error;
                    document.getElementById("cstat").textContent = "Failed";
                    setChatBusy(null);
                    return;
                }
                if (d.type === "step") {
                    const bad = d.glyph === "✗" || d.glyph === "⚠";
                    last = document.createElement("details");
                    if (bad) last.className = "bad";
                    last.innerHTML = `<summary>${esc(d.glyph)} ${esc(d.title)}</summary><pre></pre>`;
                    stepBox.appendChild(last);
                    return;
                }
                if (d.type === "detail" && last) {
                    const pre = last.querySelector("pre");
                    pre.textContent += (pre.textContent ? "\n" : "") + d.text;
                    return;
                }
                if (d.type === "text") {
                    text += (text ? "\n" : "") + d.text;
                    aEl.textContent = text;
                    return;
                }
                if (d.type === "done") {
                    aEl.innerHTML = md(d.answer || text);
                    stepBox.innerHTML = "";
                    stepBox.outerHTML = stepsHtml(d.steps);
                    const meta = document.createElement("div");
                    meta.className = "meta";
                    meta.textContent = `${d.seconds}s · ${d.credits ?? "?"} credits · ${d.model}` +
                        (d.stopped ? " · stopped" : "");
                    node.appendChild(meta);
                    TURNS.push(d);
                    if (watchId && watchId !== SEL) markChatDone(watchId);
                    setChatBusy(null);
                }
            };

            for (; ;) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                // Events are newline delimited and a read can split one in half,
                // so the trailing fragment is kept for the next chunk.
                const parts = buf.split("\n");
                buf = parts.pop();
                stick = atBottom();
                for (const line of parts) {
                    if (!line.trim()) continue;
                    try { handle(JSON.parse(line)); } catch (e) { /* partial or noise */ }
                }
                // Only auto-scroll if you were already at the bottom. Yanking the
                // view back down while someone is reading an earlier step is the
                // most annoying thing a streaming UI can do.
                if (stick) scroll.scrollTop = scroll.scrollHeight;
            }

            RUN = null;
            chatBusy(false);
            setChatBusy(null);
            paintCtx();
            markChangedFiles(watchId, before);
        }


        /* ---- tools: shared capabilities, not project members ----
           A tool is declared once and referenced by id. Ordering is by dependant count
           ascending, so the tools nothing depends on are the first thing you see. That
           list is where unkilled work has been hiding: it never appeared on a project
           board because it was never a project. */
        function toolsView() {
            const T = BOARD.tools || [], esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
            const orphan = T.filter(t => !t.used_by.length && t.status !== "retired");
            const undocumented = T.filter(t => !t.documented && t.status !== "retired");
            const missing = T.filter(t => t.path && !t.exists);
            const und = BOARD.undeclared_tools || [];

            const chip = (txt, col) => `<span class="chip" style="background:${col}">${txt}</span>`;
            const acc = a => a === "write" ? chip("write", "var(--stop)")
                : a === "read-write-local" ? chip("local write", "var(--warn)")
                    : chip("read-only", "var(--ok)");

            const row = t => `<tr>
    <td><b>${esc(t.name)}</b>
      <div class="why">${t.does ? esc(t.does) : '<span class="gap">No description. Nobody can hand this over.</span>'}</div>
      ${t.note ? `<div class="why">${esc(t.note)}</div>` : ""}</td>
    <td>${esc(t.where)}</td>
    <td>${acc(t.access)}${t.status !== "active" ? " " + chip(t.status, "var(--faint)") : ""}
        ${t.path && !t.exists ? " " + chip("path missing", "var(--stop)") : ""}</td>
    <td>${t.used_by.length
                    ? t.used_by.map(p => `<span class="lnk" onclick="pick('${p}')">${p}</span>`).join(", ")
                    : `<span class="why">nothing</span>`}</td>
    <td>${t.used_by.length || t.status === "retired" ? "" :
                    `<button class="vb kill" onclick="retireTool('${t.id}')">Retire</button>`}</td>
  </tr>`;

            return `
  <h1>Tools</h1>
  <p class="lede">Shared capabilities. A tool is not owned by whatever needed it
     first, so projects reference it by id and the description lives in one place.</p>

  <div class="card"><div class="bars">
    <div class="stat"><div class="k">Registered</div><div class="v">${T.length}</div>
      <div class="n">across this store</div></div>
    <div class="stat"><div class="k">Used by nothing</div>
      <div class="v" style="color:${orphan.length ? "var(--warn)" : "var(--ok)"}">${orphan.length}</div>
      <div class="n">either dead or undeclared</div></div>
    <div class="stat"><div class="k">Undocumented</div>
      <div class="v" style="color:${undocumented.length ? "var(--warn)" : "var(--ok)"}">${undocumented.length}</div>
      <div class="n">no one-line description</div></div>
    <div class="stat"><div class="k">Path missing</div>
      <div class="v" style="color:${missing.length ? "var(--stop)" : "var(--ok)"}">${missing.length}</div>
      <div class="n">registered but not on disk</div></div>
  </div></div>

  ${und.length ? `<div class="card"><h2>Declared but not registered</h2>
    <p class="why">A project depends on these and nothing describes them. That is
       load-bearing and undocumented, which is worse than unused.</p>
    <div>${und.map(i => chip(i, "var(--stop)")).join(" ")}</div></div>` : ""}

  <div class="card"><h2>Registry, least depended on first</h2>
    <table>
      <tr><th>Tool</th><th>Where it runs</th><th>Access</th><th>Used by</th><th></th></tr>
      ${T.map(row).join("")}
    </table>
    <p class="hint">Retiring is refused while a project still declares the tool.
       Remove the dependency first, and say why it is no longer needed there.</p>
  </div>`;
        }

        async function retireTool(id) {
            const why = prompt("Why retire " + id + "? The reason stays on the record.");
            if (why === null) return;
            const r = await fetch("/api/tool", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "retire", tool: id, reason: why, store: "work" })
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "refused"); return; }
            await load(); draw();
        }

        /* ---- triage: the view that removes things ----
           Ordered worst first, because the top of a board looks after itself. Every
           row forces one of four verdicts and none of them is "leave it". A reason is
           required, since a kill with no reason returns in six weeks as a new idea. */
        function triageView() {
            const live = BOARD.projects.filter(p => p.status === "active" || p.status === "blocked");
            const rest = BOARD.projects.filter(p => !(p.status === "active" || p.status === "blocked"));
            const order = [...live].reverse();

            const row = p => `
    <tr>
      <td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span>
        <div class="why">${p.why.join("; ") || "nothing pushing it up"}</div>
        ${p.charter.kill_when ? `<div class="why">We stop if: ${p.charter.kill_when}</div>`
                    : `<div class="why gap">No stopping condition written, so this can never fail and never end.</div>`}</td>
      <td class="num">${p.score}</td>
      <td class="num">${p.open_tasks}</td>
      <td class="num">${p.open_effort_h}h</td>
      <td>
        <input class="rsn" id="rsn-${p.id}" placeholder="Why. One line, required.">
        <div class="vrow">
          <button class="vb kill" onclick="verdict('${p.id}','killed')">Stop</button>
          <button class="vb" onclick="verdict('${p.id}','paused')">Pause</button>
          <button class="vb" onclick="verdict('${p.id}','done')">Finished</button>
          <button class="vb" onclick="verdict('${p.id}','active')">Keep</button>
        </div>
      </td>
    </tr>`;

            return `
  <h1>Triage</h1>
  <p class="lede">Weakest first. Stop it, pause it, close it, or keep it and say why.
     Leaving it alone is not one of the four.</p>

  <div class="card"><h2>Running now, weakest first</h2>
    <table>
      <tr><th>Project</th><th>Priority</th><th>Open moves</th><th>Hours left</th><th>Decision</th></tr>
      ${order.map(row).join("")}
    </table>
    <p class="why" style="margin:10px 0 0">Each decision changes one line in that
       project's own file and adds a dated entry to the decision log. Nothing else
       is written.</p>
  </div>

  ${rest.length ? `<div class="card"><h2>Already decided</h2>
    <table><tr><th>Project</th><th>Status</th><th>Open</th></tr>
    ${rest.map(p => `<tr><td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span></td>
      <td>${p.status}</td><td class="num">${p.open_tasks}</td></tr>`).join("")}
    </table></div>`: `<div class="card"><h2>Already decided</h2>
    <p class="empty">Nothing has ever been removed from this board.</p></div>`}

  <div class="card"><h2>Decision log</h2><div id="dlog"></div></div>`;
        }

        async function verdict(id, status) {
            const box = document.getElementById("rsn-" + id);
            const reason = (box && box.value || "").trim();
            if (!reason) { box.focus(); box.placeholder = "A reason is required."; return; }
            const r = await fetch("/api/verdict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ project: id, status, reason, store: "work" })
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "refused"); return; }
            await load(); draw(); loadLog();
        }

        /* The briefing output outlives a re-render. Views are rebuilt from
           scratch on every paint, so anything not held here disappears the
           moment something else on the board changes. */
        let MORNING_MD = "", MORNING_STAT = "", MORNING_DATA = null;
        let MORNING_SUMMARY = "", MORNING_SUMMARY_STAT = "", MORNING_SUMMARY_META = "";

        function renderMorningBrief() {
            if (!MORNING_MD) return `<p class="empty">Not run yet today.</p>`;
            let text = MORNING_MD;
            if (MORNING_SUMMARY.trim()) {
                text = text.replace(
                    /## 🎯 Focus & Top 3\s+> _Garfield fills this in: lead with today's focus, end with the top 3 priorities\._\s+---/,
                    `## 🎯 Focus & Top 3\n\n${MORNING_SUMMARY.trim()}\n\n---`
                );
            }
            return md(text);
        }

        function morningSummaryHtml() {
            const status = MORNING_SUMMARY_STAT ? `<span class="why">${esc(MORNING_SUMMARY_STAT)}</span>` : "";
            if (!MORNING_DATA)
                return `<p class="empty">Run Good morning first, then ask Garfield to draft the summary.</p>`;
            if (!MORNING_SUMMARY)
                return `<p class="empty">The briefing data is here. Ask Garfield to draft the Focus and Top 3 from it.</p>`;
            const meta = MORNING_SUMMARY_META ? `<div class="why" style="margin-top:8px">${esc(MORNING_SUMMARY_META)}</div>` : "";
            return `<div>${status ? `<div style="margin-bottom:8px">${status}</div>` : ""}${md(MORNING_SUMMARY)}${meta}</div>`;
        }

        function morningDataHtml() {
            if (!MORNING_DATA)
                return `<p class="empty">Run it to give Garfield the source data for the summary.</p>`;
            const d = MORNING_DATA;
            const cf = (d.carry_forward && d.carry_forward.items) || [];
            const m = d.m365 || {};
            const email = m.email || {};
            const jira = d.jira || [];
            const notes = d.recent_notes || [];
            const personal = d.personal || [];
            const escWhy = s => `<span class="why">${esc(s)}</span>`;
            const cfHtml = cf.length ? `<ul>${cf.slice(0, 5).map(x =>
                `<li><b>${esc(x.heading || "Carry-forward")}</b>: ${esc(x.text)} ${x.due_state ? escWhy(`${x.due_state}${x.due ? " " + x.due : ""}`) : ""}</li>`).join("")}</ul>`
                : `<p class="empty">No carry-forward items.</p>`;
            const jiraHtml = jira.length ? `<ul>${jira.map(row => row.available
                ? `<li><b>${esc(row.name || row.key)}</b>: ${row.blockers_count} blocker(s), ${row.overdue_count} overdue, sample ${row.open_sample}</li>`
                : `<li><b>${esc(row.key)}</b>: ${esc(row.error || "unavailable")}</li>`).join("")}</ul>`
                : `<p class="empty">No Jira projects in this run.</p>`;
            const notesHtml = notes.length ? `<ul>${notes.slice(0, 6).map(n =>
                `<li><b>${esc(n.date)}</b> ${esc(n.project)} - ${esc(n.title)}${n.summary ? `<div class="why">${esc(n.summary)}</div>` : ""}</li>`).join("")}</ul>`
                : `<p class="empty">No recent notes in the window.</p>`;
            const personalHtml = personal.length ? `<ul>${personal.map(p =>
                `<li><b>${esc(p.date)}</b> ${esc(p.title)}</li>`).join("")}</ul>`
                : `<p class="empty">No personal items in range.</p>`;
            return `
    <details open><summary>Data Garfield can summarize</summary>
      <div class="grid2" style="margin-top:8px">
        <div>
          <div class="why"><b>Carry-forward</b> ${cf.length} item(s)</div>
          ${cfHtml}
          <div class="why" style="margin-top:10px"><b>Calendar + email</b></div>
          ${m.available ? `<ul>
            <li>${(m.meetings_today || []).length} meeting(s) today</li>
            <li>${(m.focus_blocks || []).length} focus block(s)</li>
            <li>${m.upcoming_meetings_7d || 0} more meeting(s) in 7 days</li>
            <li>${email.unread_inbox || 0} unread in inbox</li>
            <li>${(email.high_importance || []).length} high-importance email(s)</li>
            <li>${(email.from_manager || []).length} from ${esc("Barnert")}</li>
          </ul>` : `<p class="empty">${esc(m.note || "Unavailable.")}</p>`}
        </div>
        <div>
          <div class="why"><b>Jira health</b></div>
          ${jiraHtml}
          <div class="why" style="margin-top:10px"><b>Recent notes</b></div>
          ${notesHtml}
          <div class="why" style="margin-top:10px"><b>Personal</b></div>
          ${personalHtml}
        </div>
      </div>
    </details>`;
        }

        function morningDataContext() {
            if (!MORNING_DATA) return [];
            const d = MORNING_DATA;
            const L = ["Good morning data available in Brief:"];
            const cf = (d.carry_forward && d.carry_forward.items) || [];
            if (cf.length) {
                L.push(`- Carry-forward: ${cf.length} item(s).`);
                cf.slice(0, 5).forEach(x => L.push(`  - ${x.heading ? x.heading + ": " : ""}${x.text}`));
            }
            const m = d.m365 || {};
            const email = m.email || {};
            if (m.available) {
                L.push(`- Calendar/email: ${(m.meetings_today || []).length} meeting(s) today, ${(m.focus_blocks || []).length} focus block(s), ${m.upcoming_meetings_7d || 0} more in 7 days, ${email.unread_inbox || 0} unread.`);
                (email.high_importance || []).slice(0, 3).forEach(x => L.push(`  - High importance: ${x.subject} (${x.from})`));
                (email.from_manager || []).slice(0, 3).forEach(x => L.push(`  - From manager: ${x.subject}`));
            } else {
                L.push(`- Calendar/email unavailable: ${m.note || "no detail"}.`);
            }
            (d.jira || []).forEach(row => {
                if (!row.available) return L.push(`- Jira ${row.key}: unavailable (${row.error || "no detail"}).`);
                L.push(`- Jira ${row.key}: ${row.blockers_count} blocker(s), ${row.overdue_count} overdue, sample ${row.open_sample}.`);
                (row.blockers || []).slice(0, 3).forEach(x => L.push(`  - Blocker: ${x.key} ${x.summary || ""}`.trim()));
                (row.overdue || []).slice(0, 3).forEach(x => L.push(`  - Overdue: ${x.key} ${x.summary || ""}`.trim()));
            });
            if ((d.recent_notes || []).length) {
                L.push(`- Recent notes: ${(d.recent_notes || []).length} item(s).`);
                d.recent_notes.slice(0, 4).forEach(n => L.push(`  - ${n.date} ${n.project}: ${n.title}${n.summary ? " - " + n.summary : ""}`));
            }
            if ((d.personal || []).length) {
                L.push(`- Personal: ${(d.personal || []).length} dated item(s).`);
                d.personal.slice(0, 4).forEach(p => L.push(`  - ${p.date} ${p.title}`));
            }
            return L;
        }

        async function draftMorningSummary() {
            const stat = document.getElementById("morningsummarystat");
            const box = document.getElementById("morningsummary");
            const out = document.getElementById("morningout");
            if (!MORNING_DATA) {
                MORNING_SUMMARY_STAT = "Run Good morning first.";
                if (stat) stat.textContent = MORNING_SUMMARY_STAT;
                if (box) box.innerHTML = morningSummaryHtml();
                return;
            }
            MORNING_SUMMARY_STAT = "Garfield is drafting the summary...";
            MORNING_SUMMARY = "";
            MORNING_SUMMARY_META = "";
            if (stat) stat.textContent = MORNING_SUMMARY_STAT;
            if (box) box.innerHTML = morningSummaryHtml();
            try {
                const modelSel = document.getElementById("cmodel");
                const r = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: "Using the Good morning data in the screen context, write the Focus and Top 3 section for today's morning briefing. Use markdown only. Start with one short focus paragraph, then exactly 3 bullet priorities. Ground every point in the provided data. If a source is unavailable, say so plainly. Do not mention tool steps or your own process.",
                        store: "work",
                        context: screenContext(),
                        project: "",
                        model: modelSel ? modelSel.value : ""
                    })
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || "summary failed");
                MORNING_SUMMARY = d.answer || "";
                MORNING_SUMMARY_STAT = "Summary ready";
                MORNING_SUMMARY_META = `${d.seconds}s · ${d.credits ?? "?"} credits · ${d.model}`;
            } catch (e) {
                MORNING_SUMMARY = "";
                MORNING_SUMMARY_META = "";
                MORNING_SUMMARY_STAT = `Failed: ${e.message}`;
            }
            if (stat) stat.textContent = MORNING_SUMMARY_STAT;
            if (box) box.innerHTML = morningSummaryHtml();
            if (out) out.innerHTML = renderMorningBrief();
        }

        /* ---- carry-forward, as decisions ----

           The morning briefing printed nineteen carry-forward items every day.
           That is not a reminder, it is wallpaper: the reading cost is the same
           every morning, the list only grows, and the rational response is to
           skip it. Nothing on it was wrong, it just had no exit.

           So each item gets three, and no more: put it on a project as a task,
           make it a project, or drop it with a reason. Every one of those
           archives the original text first, because the problem was that the
           list was unusable, not that the things on it did not matter. */
        let CARRY = [], CARRY_STAT = "", CARRY_BUSY = "";

        async function loadCarry() {
            const box = document.getElementById("carrybox");
            if (!box) return;
            try {
                const r = await fetch("/api/carry");
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || "could not read the list");
                CARRY = d.items || [];
                CARRY_STAT = "";
            } catch (e) {
                // Keep the current list on screen if refresh fails. A transient
                // read error should show a warning, not erase the work already
                // fetched.
                CARRY_STAT = e.message;
            }
            paintCarry();
        }

        function paintCarry() {
            const box = document.getElementById("carrybox");
            if (box) box.innerHTML = carryHtml();
            const count = document.getElementById("carrycount");
            if (count) count.textContent = CARRY.length
                ? `${CARRY.length} open` : (CARRY_STAT ? "" : "all clear");
        }

        function carryHtml() {
            const warn = CARRY_STAT ? `<p class="empty">${esc(CARRY_STAT)}</p>` : "";
            if (!CARRY.length)
                return warn + `<p class="empty">Nothing carried forward. The list is empty because it was decided, not because it was ignored.</p>`;
            const opts = (BOARD.projects || []).map(p =>
                `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
            return warn + CARRY.map(it => {
                const due = it.due
                    ? `<span class="chip" style="background:${it.due_state === "overdue" ? "var(--stop)" : it.due_state === "today" ? "var(--warn)" : "var(--faint)"}">${esc(it.due_state)} ${esc(it.due)}</span>`
                    : "";
                const busy = CARRY_BUSY === it.id;
                return `
      <div class="flag" style="flex-direction:column;align-items:stretch;gap:6px">
        <div><b>${esc(it.title)}</b> ${due}
          ${it.heading ? `<span class="why">${esc(it.heading)}</span>` : ""}</div>
        ${it.detail ? `<details><summary class="why">Why it was carried</summary>
          <div class="why" style="margin-top:6px">${esc(it.detail)}</div></details>` : ""}
        <div class="drow" style="gap:6px;flex-wrap:wrap">
          <select class="ed" id="carryproj-${esc(it.id)}" style="max-width:230px">${opts}</select>
          <button class="sm" ${busy ? "disabled" : ""} onclick="carryAct('${esc(it.id)}','task')"
            title="Add it to that project as a task, and take it off this list">Add as task</button>
          <button class="sm" ${busy ? "disabled" : ""} onclick="carryAct('${esc(it.id)}','project')"
            title="It is bigger than a task: make it a project of its own">New project</button>
          <button class="sm" ${busy ? "disabled" : ""} onclick="carryAct('${esc(it.id)}','drop')"
            title="Drop it with a reason. The text is archived, not deleted">Drop</button>
          ${busy ? `<span class="why">Working...</span>` : ""}
        </div>
      </div>`;
            }).join("");
        }

        async function carryAct(id, action) {
            const item = CARRY.find(x => x.id === id);
            if (!item) return;
            const body = { action, item: id, store: "work" };

            if (action === "task") {
                const sel = document.getElementById(`carryproj-${id}`);
                if (!sel || !sel.value) return;
                body.project = sel.value;
            } else if (action === "project") {
                const name = prompt("Name the project. It starts with only the problem filled in, so the charter still has to be answered.", item.title);
                if (name === null) return;
                if (!name.trim()) return;
                body.fields = { name: name.trim() };
            } else if (action === "drop") {
                const why = prompt("Why is this dropped? It goes in the archive with the original text.");
                if (why === null) return;
                if (!why.trim()) return;
                body.reason = why.trim();
            }

            CARRY_BUSY = id;
            paintCarry();
            try {
                const r = await fetch("/api/carry", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || "refused");
                CARRY_BUSY = "";
                CARRY = CARRY.filter(x => x.id !== id);
                paintCarry();
                await load();
                await loadCarry();
                if (action === "project" && d.created && d.created.project)
                    pick(d.created.project);
            } catch (e) {
                CARRY_BUSY = "";
                CARRY_STAT = e.message;
                paintCarry();
            }
        }

        async function goodMorning() {
            const stat = document.getElementById("morningstat");
            const src = document.getElementById("morningsrc");
            const sum = document.getElementById("morningsummary");
            const sumStat = document.getElementById("morningsummarystat");
            const out = document.getElementById("morningout");
            MORNING_STAT = "Running, this takes a minute...";
            if (stat) stat.textContent = MORNING_STAT;
            MORNING_DATA = null;
            MORNING_SUMMARY = "";
            MORNING_SUMMARY_STAT = "";
            MORNING_SUMMARY_META = "";
            if (sumStat) sumStat.textContent = "";
            if (sum) sum.innerHTML = morningSummaryHtml();
            if (src) src.innerHTML = `<p class="empty">Gathering the source data Garfield will summarize...</p>`;
            if (out) out.innerHTML = `<p class="empty">Reading calendar, email, Jira and notes...</p>`;
            let d;
            try {
                const r = await fetch("/api/morning", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})
                });
                d = await r.json();
                if (!r.ok) throw new Error(d.error || "the briefing failed");
            } catch (e) {
                MORNING_STAT = "Failed";
                MORNING_DATA = null;
                if (stat) stat.textContent = MORNING_STAT;
                if (src) src.innerHTML = `<p class="empty">No source data returned.</p>`;
                if (out) out.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
                return;
            }
            MORNING_MD = d.markdown || "";
            MORNING_DATA = d.data || null;
            const file = d.briefing ? d.briefing.split("/").pop() : "";
            MORNING_STAT = file ? `Saved ${file}` : "Done";
            if (stat) stat.textContent = MORNING_STAT;
            if (sum) sum.innerHTML = morningSummaryHtml();
            if (src) src.innerHTML = morningDataHtml();
            const el = document.getElementById("morningout");
            if (el) el.innerHTML = renderMorningBrief();
        }

        async function loadLog() {
            const el = document.getElementById("dlog");
            if (!el) return;
            const r = await fetch("/api/log?name=decisions.jsonl");
            const rows = (await r.json()).rows || [];
            el.innerHTML = rows.length ? `<table>
    <tr><th>When</th><th>Project</th><th>Change</th><th>Reason</th></tr>
    ${rows.map(x => `<tr><td class="num">${x.at.slice(0, 16).replace("T", " ")}</td>
      <td>${x.name}</td><td>${x.from} to ${x.to}</td>
      <td class="why">${x.reason}</td></tr>`).join("")}</table>`
                : `<p class="empty">No decisions recorded yet.</p>`;
        }

        async function loadTree(id, force = false) {
            if (!id) return null;
            if (TREE[id] && !force) return TREE[id];
            const r = await fetch("/api/tree?scope=project&id=" + encodeURIComponent(id));
            const data = await r.json();
            TREE[id] = r.ok ? data
                : {
                    error: r.status === 404
                        ? "Tree endpoint not served. This HiveFrame process predates it; restart the server."
                        : (data.error || "tree unavailable")
                };
            if (VIEW === "project" && !FILE_DIRTY) draw();
            drawFiles();
            return TREE[id];
        }

        function treeLeaf(n) {
            const name = esc(n.name || n.path);
            const size = typeof n.size === "number" ? `<span class="why">${fsize(n.size)}</span>` : "";
            if (n.exists === false) return `<div class="tree-item"><span class="missing">${name}</span> <span class="gap">missing</span></div>`;
            /* Clicking opens the file here rather than in Finder. Leaving to
               another application to read one paragraph is the context switch
               this view exists to avoid. Finder moved to the preview header,
               because one Finder link per row is a lot of furniture for
               something used once a week. */
            const on = FILE && FILE.path === n.path ? " on" : "";
            const ctx = importedFileContext(n.path);
            return `<div class="tree-item${on}" title="${esc(n.path)}">
                <span class="lnk" onclick='openFile(${JSON.stringify(n.path)})'>${name}</span> ${size}
                ${ctx ? ` <button class="vb" onclick='removeImportedFile(${JSON.stringify(n.path)})'>Remove</button>` : ""}
            </div>`;
        }


        function fsize(b) {
            if (b < 1024) return b + " B";
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
            return (b / 1024 / 1024).toFixed(1) + " MB";
        }

        function treeNode(n) {
            if (n.kind === "file") return treeLeaf(n);
            const children = (n.children || []).map(treeNode).join("") || `<div class="empty">Empty</div>`;
            const flags = [n.exists === false ? `<span class="gap">missing</span>` : "",
            n.truncated ? `<span class="gap">${n.hidden ? n.hidden + " more hidden" : "truncated"}</span>` : ""]
                .filter(Boolean).join(" ");
            /* A bare node drops its own summary row: the rail already names the
               root above it, and a folder you cannot collapse does not need a
               disclosure triangle. */
            if (n.bare) return `<div>${children}</div>`;
            return `<details class="tree-dir"${n.open ? " open" : ""}>
                <summary><span class="tree-name">${esc(n.name || n.path)}</span>${flags ? ` <span class="why">${flags}</span>` : ""}</summary>
                <div class="tree-children">${children}</div>
            </details>`;
        }

        /* Files the assistant changed during the last turn, and the files you
           have opened before. Both are per project, because a change in one
           project is not news while you are reading another. */
        let TOUCHED = {};
        const HIST_KEY = "hiveframe.filehistory", HIST_MAX = 25;
        let HISTORY = {};
        try { HISTORY = JSON.parse(localStorage.getItem(HIST_KEY) || "{}"); } catch (e) { HISTORY = {}; }

        function histAdd(path, label) {
            if (!SEL) return;
            const list = (HISTORY[SEL] || []).filter(e => e.path !== path);
            list.unshift({ path, label: label || path.split("/").pop() });
            HISTORY[SEL] = list.slice(0, HIST_MAX);
            try { localStorage.setItem(HIST_KEY, JSON.stringify(HISTORY)); } catch (e) { }
            drawHist();
        }

        function drawHist() {
            const sel = document.getElementById("fhist");
            if (!sel) return;
            const list = HISTORY[SEL] || [];
            /* Disabled rather than hidden. A control that appears only once it
               has content reads as a glitch the first time it shows up. */
            sel.disabled = !list.length;
            sel.innerHTML = `<option value="">${list.length ? "Recent" : "No history"}</option>` +
                list.map(e => `<option value="${esc(e.path)}" title="${esc(e.path)}">${esc(e.label)}</option>`).join("");
            sel.value = "";
        }

        /* mtime map of every file in the project, used to see what a chat turn
           wrote. The assistant edits through its own tools and does not report
           what it touched, so the file system is the only honest witness. */
        function mtimeMap(t) {
            const out = {};
            const walk = n => {
                if (!n) return;
                if (n.kind === "file") { if (n.mtime) out[n.path] = n.mtime; return; }
                (n.children || []).forEach(walk);
            };
            (t && t.roots || []).forEach(r => walk(r.tree));
            return out;
        }

        async function markChangedFiles(id, before) {
            if (!id) return;
            const t = await loadTree(id, true);
            const after = mtimeMap(t);
            const changed = Object.keys(after).filter(p => before[p] !== after[p]);
            if (!changed.length) return;
            TOUCHED[id] = changed;
            drawFiles();
            /* Open the change rather than only flagging it. A notice you have
               to go and act on is one more step between the edit and reading
               it. If several files changed, the first is opened and the rest
               stay marked. */
            if (id === SEL && !FILE_DIRTY) openFile(changed[0]);
        }

        /* The tree lives in the rail, so it renders into its own element rather
           than into the main view. It survives a tab change, which is the point:
           you can read a file while looking at Triage. */
        function drawFiles() {
            drawHist();
            const el = document.getElementById("ftree");
            if (!el) return;
            const id = SEL;
            if (!id) return el.innerHTML = `<p class="empty">No project selected.</p>`;
            const t = TREE[id];
            if (!t) { loadTree(id); return el.innerHTML = `<p class="empty">Loading…</p>`; }
            if (t.error) return el.innerHTML = `<p class="empty">${esc(t.error)}</p>`;
            const roots = t.roots || [];
            if (!roots.length) return el.innerHTML = `<p class="empty">No folder declared for this project.</p>`;
            const taskMode = task && task.t && task.t.id ? `task: ${task.t.title}` : "project files";
            el.innerHTML = `
                <div class="ftbar">
                  <button class="sm pri" onclick="pickImportFiles()">Add files</button>
                  <button class="sm" onclick="pickImportFolder()">Add folder</button>
                  <span class="dst">Drop or paste an image here. Destination: ${esc(taskMode)}</span>
                  <select class="fmode" id="fmode" title="Import destination">
                    <option value="project">Project files</option>
                    <option value="task"${task && task.t && task.t.id ? " selected" : ""}>Current task</option>
                  </select>
                </div>
                <div class="dropzone" id="fdrop">Drop files here or paste an image.</div>
                ${roots.map(r => `
                <div class="rlabel">${esc(r.label)}</div>
                ${treeNode(Object.assign({ open: true, bare: true }, r.tree))}
            `).join("") + (t.note ? `<p class="empty">${esc(t.note)}</p>` : "")}`;
            const mode = document.getElementById("fmode");
            if (mode) {
                mode.value = !IMPORT_MODE_SAVED && task && task.t && task.t.id ? "task"
                    : (IMPORT_MODE === "task" && task && task.t && task.t.id ? "task" : "project");
                mode.onchange = e => setImportMode(e.target.value);
            }
            bindImportZone();
            markTouched();
            markOpenFile();
        }

        /* Marks are applied after render rather than baked into the row, so
           clearing one does not rebuild the tree and collapse your folders. */
        function markTouched() {
            const set = new Set(TOUCHED[SEL] || []);
            document.querySelectorAll("#ftree .tree-item").forEach(el => {
                el.classList.toggle("touched", set.has(el.getAttribute("title")));
            });
            document.querySelectorAll("#ftree .tree-dir").forEach(d => {
                const hit = !!d.querySelector(".tree-item.touched");
                d.classList.toggle("hastouch", hit);
                /* A change inside a folder you have closed is a change you will
                   not see, so open the path to it. */
                if (hit) d.open = true;
            });
        }



        /* ---- preview panel: open, read, edit, save ----
           Read and write go through the server, which allows only paths inside
           a folder this board already declares. The browser sends a path; it
           does not get to choose what counts as reachable.

           The panel is a sibling of the main column, not a card inside it, so
           opening a file does not push the project you were reading off the
           screen. That was the first version and it was the wrong shape: a
           preview that displaces the thing it is previewing for. */
        let FILE = null, FILE_DIRTY = false, FILE_SRC = false;

        async function openFile(path) {
            if (FILE_DIRTY && !confirm("Unsaved changes will be lost. Open anyway?")) return;
            FILE = { path, loading: true }; FILE_DIRTY = false; FILE_SRC = false;
            /* Opening it is reading it, so the mark has done its job. */
            if (SEL && TOUCHED[SEL]) {
                TOUCHED[SEL] = TOUCHED[SEL].filter(p => p !== path);
                markTouched();
            }
            showPrev(true); drawPrev();
            const r = await fetch("/api/file?path=" + encodeURIComponent(path));
            const d = await r.json();
            FILE = r.ok ? d : { path, error: d.error || "could not open" };
            if (r.ok) histAdd(path, d.rel || d.name);
            drawPrev();
        }


        function closeFile() {
            if (FILE_DIRTY && !confirm("Unsaved changes will be lost. Close anyway?")) return;
            FILE = null; FILE_DIRTY = false; showPrev(false); drawPrev();
        }

        /* The panel takes width only while something is in it. An empty third
           of the screen is worse than no panel. */
        function showPrev(on) {
            const app = document.getElementById("app");
            app.classList.toggle("noprev", !on);
            /* An inline custom property outranks the .noprev class rule, so
               closing has to remove it rather than rely on the class. */
            if (on) app.style.setProperty("--w-prev", (LAYOUT.prev || 560) + "px");
            else app.style.removeProperty("--w-prev");
        }

        function fileDirty() {
            if (FILE_DIRTY) return;
            FILE_DIRTY = true;
            const s = document.getElementById("fstate");
            if (s) { s.textContent = "unsaved changes"; s.className = "gap"; }
        }

        function toggleSource() { FILE_SRC = !FILE_SRC; drawPrev(); }

        /* Highlight the open file without re-rendering the tree, which would
           collapse every folder you had opened to get there. */
        function markOpenFile() {
            const want = FILE && FILE.path ? FILE.path : null;
            document.querySelectorAll("#ftree .tree-item").forEach(el => {
                el.classList.toggle("on", !!want && el.getAttribute("title") === want);
            });
        }


        async function saveFile() {
            const ta = document.getElementById("fedit");
            if (!ta || !FILE) return;
            const s = document.getElementById("fstate");
            if (s) { s.textContent = "saving…"; s.className = "why"; }
            const r = await fetch("/api/file", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: FILE.path, text: ta.value })
            });
            const d = await r.json();
            if (!r.ok) { if (s) { s.textContent = d.error || "save refused"; s.className = "missing"; } return; }
            FILE.text = ta.value; FILE.size = d.bytes; FILE_DIRTY = false;
            if (s) { s.textContent = "saved, " + fsize(d.bytes) + ", previous version kept as .bak"; s.className = "why"; }
            /* A project file that was just edited is the board. Reload it, or
               the screen and the file disagree until the next refresh. */
            if (FILE.path.endsWith(".toml")) await load();
        }

        function projectRootPath() {
            const p = proj(SEL);
            return p && (p.folders || [])[0] ? p.folders[0].path : "";
        }

        function currentImportTaskId() {
            const mode = document.getElementById("fmode")?.value || IMPORT_MODE;
            if (mode !== "task") return "";
            if (task && task.t && task.t.id) return task.t.id;
            alert("Select a task first, or switch the import destination back to project files.");
            return null;
        }

        function currentImportLabel() {
            const tid = currentImportTaskId();
            if (!tid) return "project files";
            return task && task.t ? `task ${task.t.id}` : "project files";
        }

        function ensureImportPickers() {
            if (!window._PICK_FILE) {
                const f = document.createElement("input");
                f.type = "file";
                f.multiple = true;
                f.style.display = "none";
                f.addEventListener("change", async e => {
                    const files = [...e.target.files || []];
                    if (files.length) await importFiles(files, false);
                    e.target.value = "";
                });
                document.body.appendChild(f);
                window._PICK_FILE = f;
            }
            if (!window._PICK_FOLDER) {
                const f = document.createElement("input");
                f.type = "file";
                f.multiple = true;
                f.setAttribute("webkitdirectory", "");
                f.style.display = "none";
                f.addEventListener("change", async e => {
                    const files = [...e.target.files || []];
                    if (files.length) await importFiles(files, true);
                    e.target.value = "";
                });
                document.body.appendChild(f);
                window._PICK_FOLDER = f;
            }
        }

        function pickImportFiles() {
            ensureImportPickers();
            window._PICK_FILE.click();
        }

        function pickTaskFiles(taskId) {
            const f = document.createElement("input");
            f.type = "file";
            f.multiple = true;
            f.style.display = "none";
            f.addEventListener("change", async e => {
                const files = [...e.target.files || []];
                if (files.length) await importFiles(files, false, taskId);
                f.remove();
            });
            document.body.appendChild(f);
            f.click();
        }

        function importedFileContext(path) {
            const p = String(path || "");
            const m = p.match(/\/files\/tasks\/([^/]+)\//);
            if (m) return { action: "task.file.remove", task: m[1] };
            if (p.includes("/files/project/")) return { action: "project.file.remove" };
            return null;
        }

        async function removeImportedFile(path) {
            const ctx = importedFileContext(path);
            if (!ctx) { alert("That file can only be removed from the imported files area."); return; }
            if (!confirm("Remove this file? This deletes it from disk and clears any task attachment.")) return;
            await api({ action: ctx.action, path });
        }

        async function removeTaskFile(taskId, path) {
            if (!confirm("Remove this file from the task? This deletes it from disk.")) return;
            await api({ action: "task.file.remove", task: taskId, path });
        }

        function pickImportFolder() {
            ensureImportPickers();
            window._PICK_FOLDER.click();
        }

        function b64FromBytes(bytes) {
            let bin = "";
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                bin += String.fromCharCode(...bytes.subarray(i, i + chunk));
            }
            return btoa(bin);
        }

        async function specFromFile(file, rel) {
            const buf = new Uint8Array(await file.arrayBuffer());
            return {
                name: file.name || rel.split("/").pop(),
                rel: rel || file.webkitRelativePath || file.name,
                data_b64: b64FromBytes(buf),
            };
        }

        function guessNameFromMime(mime) {
            const m = (mime || "").toLowerCase();
            if (m === "image/png") return "png";
            if (m === "image/jpeg") return "jpg";
            if (m === "image/gif") return "gif";
            if (m === "image/webp") return "webp";
            if (m === "image/svg+xml") return "svg";
            return "bin";
        }

        function stampName(prefix, mime) {
            const d = new Date();
            const t = d.toISOString().replace(/[:.]/g, "-");
            return `${prefix}-${t}.${guessNameFromMime(mime)}`;
        }

        async function importFiles(files, preserveRelative, taskIdOverride = "", forceProject = false) {
            const root = projectRootPath();
            if (!root) { alert("This project has no folder to hold imported files."); return; }
            const taskId = forceProject ? "" : (taskIdOverride || currentImportTaskId());
            if (taskId === null) return;
            const action = taskId ? "task.file.add" : "project.file.add";
            const payload = [];
            for (const file of files) {
                const rel = preserveRelative ? (file.webkitRelativePath || file.name) : file.name;
                payload.push(await specFromFile(file, rel));
            }
            const r = await fetch("/api/edit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    store: "work",
                    project: SEL,
                    action,
                    task: taskId || "",
                    files: payload
                })
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "import refused"); return; }
            await loadTree(SEL, true);
            await load();
            return d.imported || [];
        }

        async function importClipboardImage(items, taskIdOverride = "", forceProject = false) {
            const files = [];
            for (const item of items) {
                const file = item.getAsFile && item.getAsFile();
                if (!file) continue;
                const name = file.name || stampName("pasted", file.type);
                files.push(new File([file], name, { type: file.type || "application/octet-stream" }));
            }
            if (files.length) return await importFiles(files, false, taskIdOverride, forceProject);
            return [];
        }

        function bindImportZone() {
            const z = document.getElementById("fdrop");
            if (!z) return;
            z.ondragover = e => { e.preventDefault(); z.classList.add("drag"); };
            z.ondragleave = () => z.classList.remove("drag");
            z.ondrop = async e => {
                e.preventDefault();
                z.classList.remove("drag");
                const files = [...(e.dataTransfer?.files || [])];
                if (!files.length) return;
                await importFiles(files, !!e.dataTransfer?.items && [...e.dataTransfer.items].some(i => i.webkitGetAsEntry && i.webkitGetAsEntry() && i.webkitGetAsEntry().isDirectory));
            };
        }

        async function handlePasteImport(e) {
            if (!e.clipboardData) return;
            const files = [...(e.clipboardData.files || [])];
            const target = e.target instanceof Element ? e.target : null;
            const active = document.activeElement instanceof Element ? document.activeElement : null;
            const inChat = !!([target, active].find(n => n && n.closest && n.closest("#crail")));
            if (files.length) {
                e.preventDefault();
                const imported = await importFiles(files, false, "", inChat);
                if (inChat) addChatAttach(imported || []);
                return;
            }
            const items = [...(e.clipboardData.items || [])].filter(i => i.kind === "file");
            if (items.some(i => (i.type || "").startsWith("image/"))) {
                e.preventDefault();
                const imported = await importClipboardImage(items.filter(i => (i.type || "").startsWith("image/")), "", inChat);
                if (inChat) addChatAttach(imported || []);
            }
        }

        function drawPrev() {
            const el = document.getElementById("prev");
            markOpenFile();
            if (!FILE) { el.innerHTML = ""; return; }

            const raw = "/api/raw?path=" + encodeURIComponent(FILE.path);
            const isMd = /\.md$/i.test(FILE.path);
            const canRender = (isMd || FILE.kind === "html") && FILE.editable;

            const head = `<div class="fhead">
      <span class="fname" title="${esc(FILE.path)}">${esc(FILE.rel || FILE.name || FILE.path)}</span>
      ${canRender ? `<button class="sm" onclick="toggleSource()">${FILE_SRC ? "Preview" : "Edit"}</button>` : ""}
      ${FILE.editable && (FILE_SRC || !canRender) ? `<button class="sm pri" onclick="saveFile()">Save</button>` : ""}
      <button class="sm" onclick='reveal(${JSON.stringify(FILE.path)})'>Finder</button>
      <button class="sm" onclick="closeFile()">Close</button>
    </div>`;

            const foot = `<div class="ffoot"><span id="fstate" class="why">${fsize(FILE.size || 0)}</span></div>`;

            if (FILE.loading) return void (el.innerHTML = `<div class="fhead"><span class="fname">Opening…</span></div>`);
            if (FILE.error) return void (el.innerHTML = head + `<div class="fempty">${esc(FILE.error)}</div>`);

            let body;
            if (FILE.kind === "pdf") {
                body = `<iframe src="${raw}" title="${esc(FILE.name)}"></iframe>`;
            } else if (FILE.kind === "image") {
                body = `<div class="fread" style="max-width:none"><img src="${raw}" alt="${esc(FILE.name)}"></div>`;
            } else if (!FILE.editable) {
                /* Office formats and anything else the browser cannot render.
                   Saying so plainly and offering the real application beats a
                   blank frame that looks broken. */
                body = `<div class="fempty">${esc(FILE.reason || "cannot be shown here")}.
          ${fsize(FILE.size || 0)}.<br><br>
          <button class="sm" onclick='reveal(${JSON.stringify(FILE.path)})'>Show in Finder</button></div>`;
            } else if (canRender && !FILE_SRC) {
                body = isMd
                    ? `<div class="fread">${md(FILE.text)}</div>`
                    : `<iframe src="${raw}" title="${esc(FILE.name)}" sandbox="allow-same-origin"></iframe>`;
            } else {
                body = `<textarea class="fedit" id="fedit" spellcheck="false" oninput="fileDirty()">${esc(FILE.text)}</textarea>`;
            }
            el.innerHTML = head + `<div class="fbody2">${body}</div>` + foot;
            const ta = document.getElementById("fedit");
            if (ta && FILE_SRC) ta.focus();
        }

        function projectView() {
            const p = proj(SEL);
            if (!p) return `<p class="empty">No projects. Add a .toml file to the projects directory.</p>`;
            const c = p.charter;
            const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
            numberTasks(p);
            /* Numbering above runs over every task; the filter only decides what
               is drawn, so #3 is #3 whatever is on screen. */
            const shownTasks = (p.tasks || []).filter(taskFilterMatch);

            /* Charter fields are editable in place. The charter is the thing that stops
               drift, so making it hard to correct guarantees it goes stale and stops
               being believed. */
            const crow = (k, label, v) => `
    <div class="crow"><span class="ck">${label}</span>
      <span>${EDIT
                    ? `<textarea class="ed" data-charter="${k}">${esc(v)}</textarea>`
                    : (v ? esc(v) : '<span class="gap">not stated</span>')}</span></div>`;

            const otherIds = BOARD.projects.filter(x => x.id !== p.id).map(x => x.id);

            return `
  <h1>${p.name}</h1>
  <p class="lede">${p.tier || "project"} · ${p.kind} ·
     <span title="${HZ_MEANS[p.horizon] || ""}">${p.horizon || "no horizon set"}</span> · ${p.status} ·
     priority ${p.score} <span class="why">(${p.why.join("; ") || "nothing pushing it up"})</span></p>

  <div class="card charter">

`;
        }


        function toggleUses() {
            const b = document.getElementById("usesbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }
        async function saveUses() {
            const ids = [...document.querySelectorAll(".use-ck")].filter(c => c.checked).map(c => c.value);
            await api({ action: "uses", fields: { uses: ids } });
        }

        /* ---- edit plumbing ---- */
        let EDIT = false;
        function setEdit(on) { EDIT = on; draw(); }
        function toggleAdd() {
            const b = document.getElementById("addbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
            if (b.style.display === "block") document.getElementById("nt-title").focus();
        }
        function toggleArt() {
            const b = document.getElementById("artbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }
        function toggleRel() {
            const b = document.getElementById("relbox");
            b.style.display = b.style.display === "none" ? "block" : "none";
        }

        async function api(body) {
            const r = await fetch("/api/edit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.assign({ store: "work", project: SEL }, body))
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || "refused"); return false; }
            if (String(body.action || "").includes("file.")) await loadTree(SEL, true);
            await load(); draw();
            return true;
        }

        async function saveCharter() {
            const f = {};
            document.querySelectorAll("[data-charter]").forEach(el => f[el.dataset.charter] = el.value);
            EDIT = false;
            await api({ action: "charter", fields: f });
        }
        async function addTask() {
            const v = id => document.getElementById(id).value;
            const ck = id => document.getElementById(id).checked;
            await api({
                action: "task.add", fields: {
                    title: v("nt-title"), due: v("nt-due"),
                    effort_h: v("nt-effort"), urgent: ck("nt-urgent"), important: ck("nt-important"),
                    note: v("nt-note")
                }
            });
        }

        function dueISO(days = 0) {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            if (days === "month") d.setMonth(d.getMonth() + 1);
            else d.setDate(d.getDate() + days);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        function setDueQuick(id, days) {
            const el = document.getElementById(id);
            if (!el) return;
            el.value = dueISO(days);
            el.dispatchEvent(new Event("input", { bubbles: true }));
            el.focus();
        }

        function clearDue(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.value = "";
            el.dispatchEvent(new Event("input", { bubbles: true }));
            el.focus();
        }

        async function taskField(id, k, v) { await api({ action: "task.edit", task: id, fields: { [k]: v } }); }

        /* ---- correcting a move ----
           A task is written in a hurry and read for weeks. The wording drifts
           from what the work turned out to be, the date slips, the estimate was
           a guess. Editing in place is how the board keeps saying something
           true; the alternative is dropping it and adding a near-duplicate,
           which loses the record and the hours with it.

           One row at a time. Two open editors is two sets of unsaved changes
           and no way to tell which is which. */
        let TEDIT = "";

        function editTask(id) { TEDIT = id; draw(); }

        async function saveTask(id) {
            const v = i => document.getElementById(i).value;
            const ck = i => document.getElementById(i).checked;
            const title = v("te-title").trim();
            /* Caught here as well as on the server, so the answer is instant
               and the typed row is not thrown away to find out. */
            if (!title) { alert("A move needs a title."); return; }
            TEDIT = "";
            await api({
                action: "task.edit", task: id, fields: {
                    title, due: v("te-due"), effort_h: v("te-effort") || 0,
                    urgent: ck("te-urgent"), important: ck("te-important"),
                    note: v("te-note").trim()
                }
            });
        }

        async function dropTask(id) {
            const why = prompt("Why is this task dropped? It stays on the record with the reason.");
            if (why === null) return;
            await api({ action: "task.drop", task: id, reason: why });
        }
        async function addArtifact() {
            const v = id => document.getElementById(id).value;
            await api({ action: "artifact.add", fields: { label: v("na-label"), path: v("na-path"), kind: v("na-kind") } });
        }
        async function addRelation() {
            const v = id => document.getElementById(id).value;
            await api({ action: "relation.add", to: v("nr-to"), type: v("nr-type"), note: v("nr-note") });
        }
        async function relVerdict(to, verdict) { await api({ action: "relation.verdict", to, verdict }); }

        function briefView() {
            const top = BOARD.projects.slice(0, 5), bottom = BOARD.projects.slice(-5).reverse();
            const c = BOARD.capacity;
            const flags = [];
            c.at_risk.forEach(r => flags.push(["var(--stop)",
                `<b>${r.title}</b> needs ${r.effort_h}h and only ${r.hours_available}h are free before it is due on ${r.due}`]));
            if (c.overcommitted) flags.push(["var(--stop)",
                `More work is committed than there are hours to do it, by ${c.overcommitted_by_h}h over the next ${c.window_days} days. Something has to give.`]);
            BOARD.projects.forEach(p => {
                p.relations.filter(r => r.status === "suggested").forEach(r =>
                    flags.push(["var(--info)", `<b>${p.name}</b> may be linked to ${r.to}. Confirm it or dismiss it.`]));
                if (!p.charter.complete && p.status === "active")
                    flags.push(["var(--warn)",
                        `<b>${p.name}</b> has not answered: ${p.charter.missing.map(fieldLabel).join(", ")}`]);
            });

            return `
  <h1>Brief</h1>
  <p class="lede">The five to push and the five to decide about. One decision each,
     then stop.</p>

  <div class="card"><h2>Good morning
    <span class="toolbar">
      <button class="sm" onclick="goodMorning()" title="Run the start-my-day routine: calendar, email, Jira health, recent notes">Run it</button>
      <button class="sm" onclick="draftMorningSummary()" title="Ask Garfield to draft the Focus and Top 3 from the Good morning data">Draft summary</button>
      <span class="why" id="morningstat">${esc(MORNING_STAT)}</span>
      <span class="why" id="morningsummarystat">${esc(MORNING_SUMMARY_STAT)}</span>
    </span></h2>
    <p class="why" style="margin:0 0 8px">Calendar and email, Jira health, recent meeting
       notes, dated personal items. Read-only, and it takes a minute or so.</p>
    <div id="morningsummary">${morningSummaryHtml()}</div>
    <div id="morningsrc">${morningDataHtml()}</div>
    <div id="morningout">${renderMorningBrief()}</div>
  </div>

  <div class="card"><h2>Carry-forward, decide each one
    <span class="toolbar"><span class="why" id="carrycount"></span></span></h2>
    <p class="why" style="margin:0 0 8px">Three exits: onto a project as a task, into a
       project of its own, or dropped with a reason. All three keep the original text in
       the archive beside the file.</p>
    <div id="carrybox"><p class="empty">Loading...</p></div>
  </div>

  <div class="card"><h2>Needs attention</h2>
    ${flags.length ? flags.map(([col, txt]) =>
                `<div class="flag"><i class="b" style="background:${col}"></i><span>${txt}</span></div>`).join("")
                    : `<p class="empty">Nothing needs attention.</p>`}</div>

  <div class="card"><h2>Top 5, do these</h2>
    <table><tr><th>Project</th><th>Priority</th><th>Why it is near the top</th></tr>
    ${top.map(p => `<tr><td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span></td>
      <td class="num">${p.score}</td><td class="why">${p.why.join("; ") || "nothing pushing it up"}</td></tr>`).join("")}
    </table></div>

  <div class="card"><h2>Bottom 5, decide about these</h2>
    <table><tr><th>Project</th><th>Priority</th><th>Why it dropped</th></tr>
    ${bottom.map(p => `<tr><td><span class="lnk" onclick="pick('${p.id}')">${p.name}</span></td>
      <td class="num">${p.score}</td><td class="why">${p.why.join("; ") || "nothing pushing it up"}</td></tr>`).join("")}
    </table>
    <p class="why" style="margin:10px 0 0">Stop it, pause it with a reason, or give it a
       date. Leaving it alone is not one of the three.</p>
  </div>`;
        }

        function capView() {
            const c = BOARD.capacity;
            return `
  <h1>Capacity</h1>
  <p class="lede">The hours in the week against the hours already promised. Estimates
     start out wrong; timed work sessions correct them.</p>
  <div class="card"><div class="bars">
    <div class="stat"><div class="k">Hours free</div><div class="v">${c.available_h}h</div>
      <div class="n">${c.weekly_hours}h a week over the next ${c.window_days} days${c.operations_h ? `, less ${c.operations_h}h of routine running work` : ""}</div></div>
    <div class="stat"><div class="k">Hours promised</div><div class="v">${c.committed_h}h</div>
      <div class="n">work with a date in this window</div></div>
    <div class="stat"><div class="k">Not yet scheduled</div><div class="v">${c.undated_h}h</div>
      <div class="n">no date set, so it is not in the forecast</div></div>
    <div class="stat"><div class="k">Over-promised</div>
      <div class="v" style="color:${c.overcommitted ? "var(--stop)" : "var(--ok)"}">${c.overcommitted ? c.overcommitted_by_h + "h" : "no"}</div>
      <div class="n">${c.overcommitted ? "something has to be cut" : "it fits, on today's estimates"}</div></div>
  </div></div>
  <div class="card"><h2>At risk of missing its date</h2>
    ${c.at_risk.length ? `<table>
      <tr><th>Move</th><th>Project</th><th>Due</th><th>Days left</th><th>Hours needed</th><th>Hours free</th></tr>
      ${c.at_risk.map(r => `<tr><td>${r.title}</td>
        <td><span class="lnk" onclick="pick('${r.project}')">${r.project_name}</span></td>
        <td class="num">${r.due}</td><td class="num">${r.days_left}d</td>
        <td class="num">${r.effort_h}h</td>
        <td class="num missing">${r.hours_available}h</td></tr>`).join("")}
      </table>`: `<p class="empty">Nothing is at risk on today's estimates.</p>`}
