<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HiveFrame</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --rail: #13161c;
            --line: #262b35;
            --ink: #e8eaed;
            --dim: #9aa3b2;
            --faint: #6b7280;
            --acc: #f2b134;
            --ok: #27ae60;
            --warn: #f2994a;
            --stop: #eb5757;
            --info: #4c9aff;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            font: 14.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif
        }

        /* Four columns, each with a drag handle between it and the next.

           Widths are CSS variables so a drag is one property write rather than
           a re-layout, and they persist, because a layout you have to rebuild
           every morning is one you stop adjusting. The preview column is 0 wide
           until a file is open: an empty panel taking a third of the screen is
           worse than no panel. */
        .app {
            --w-rail: 290px;
            --w-prev: 0px;
            --w-chat: 380px;
            display: grid;
            grid-template-columns:
                var(--w-rail) 4px minmax(320px, 1fr) 4px var(--w-prev) 4px var(--w-chat);
            height: 100vh
        }

        /* Chat collapses rather than unmounts. Unmounting would discard the
           answer on screen, and an assistant you lose by glancing away is one
           you stop asking. */
        .app.nochat {
            --w-chat: 0px
        }

        .app.noprev {
            --w-prev: 0px
        }

        .gutter {
            background: transparent;
            cursor: col-resize;
            position: relative
        }

        .gutter::after {
            content: "";
            position: absolute;
            inset: 0 1px;
            background: var(--line);
            transition: background .12s
        }

        .gutter:hover::after,
        .gutter.dragging::after {
            background: var(--accent, #4c9aff)
        }

        /* A gutter next to a collapsed panel would be a handle that resizes
           nothing, so it goes away with the panel.

           Every child is pinned to its own column. Without that, a hidden
           gutter drops out of the grid and everything after it slides one
           track left, which put the chat panel in a 4px gutter track and made
           it look like chat had vanished. */
        .rail {
            grid-column: 1
        }

        .g-rail {
            grid-column: 2
        }

        .main {
            grid-column: 3
        }

        .g-prev {
            grid-column: 4
        }

        .prev {
            grid-column: 5
        }

        .g-chat {
            grid-column: 6
        }

        .crail {
            grid-column: 7
        }

        .app.nochat .gutter.g-chat,
        .app.noprev .gutter.g-prev,
        .app.noprev .prev,
        .app.nochat .crail {
            display: none
        }

        /* While dragging, the iframe would swallow the pointer and the drag
           would stop halfway across a PDF. */
        body.dragging iframe {
            pointer-events: none
        }

        /* ---- left rail: the projects, always visible ---- */
        .rail {
            background: var(--rail);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .brand {
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 9px
        }

        .hex {
            width: 18px;
            height: 20px;
            flex: none;
            background: var(--acc);
            clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%)
        }

        .brand b {
            font-size: 15px;
            font-weight: 650;
            letter-spacing: .01em
        }

        .brand span {
            color: var(--faint);
            font-size: 11px;
            margin-left: auto
        }

        .railhead {
            padding: 11px 16px 7px;
            color: var(--faint);
            font-size: 11px;
            letter-spacing: .07em;
            text-transform: uppercase
        }

        .pitem {
            padding: 9px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 3px 8px
        }

        .pitem:hover {
            background: #1a1e26
        }

        .pitem.on {
            background: #1d222c;
            border-left-color: var(--acc)
        }

        /* ---- program grouping ----
           Children are indented and share a hairline, so the rail shows what
           belongs to what without a second level of disclosure triangles. */
        .ghead {
            padding: 10px 14px 4px;
            display: grid;
            grid-template-columns: 14px 1fr auto;
            gap: 2px 6px;
            align-items: baseline;
            cursor: pointer
        }

        .ghead:hover {
            background: #1a1e26
        }

        /* Collapsed, the header is the whole group, so it gets the bottom
           padding the first child would have had. */
        .ghead.closed {
            padding-bottom: 10px
        }

        .ghead+.pitem {
            padding-top: 6px
        }

        .gtwist {
            color: var(--faint);
            cursor: pointer;
            font-size: 10px;
            user-select: none
        }

        .gname {
            font-size: 12.5px;
            font-weight: 650;
            cursor: pointer
        }

        .gname.on {
            color: var(--acc)
        }

        .ghead.plain .gname {
            color: var(--faint);
            font-size: 11px;
            letter-spacing: .07em;
            text-transform: uppercase;
            font-weight: 600
        }

        .gtag {
            color: var(--faint);
            font-size: 10.5px
        }

        .gmeta {
            grid-column: 2/4;
            color: var(--faint);
            font-size: 11px
        }

        .pitem.sub {
            padding-left: 26px;
            margin-left: 20px;
            border-left: 1px solid var(--line)
        }

        .pitem.sub.on {
            border-left-color: var(--acc)
        }

        tr.editing>td {
            background: #1a1e26;
            vertical-align: top
        }

        .pname {
            font-size: 13.5px;
            font-weight: 550;
            grid-column: 1
        }

        .pmeta {
            grid-column: 1;
            color: var(--faint);
            font-size: 11.5px
        }

        .pscore {
            grid-column: 2;
            grid-row: 1/3;
            align-self: center;
            color: var(--dim);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            background: #20252f;
            border-radius: 4px;
            padding: 2px 6px;
            height: fit-content
        }

        .hz {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 5px;
            color: #0f1115
        }

        .railfoot {
            border-top: 1px solid var(--line);
            padding: 10px 16px;
            font-size: 11.5px;
            color: var(--faint)
        }

        /* ---- files, in the rail under the projects ----
           Which project and which file are the same question asked twice, so
           they belong on the same axis. Keeping files out of the main column
           means opening one does not push the project you were reading off
           the screen.

           Projects and files split the rail's spare height. Projects get the
           smaller share because that list is short and stable; the file tree
           is the one that grows. */
        .railsplit {
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--line);
            margin-top: 4px
        }

        .railsplit .sm {
            margin-left: auto;
            text-transform: none;
            letter-spacing: 0
        }

        .plist {
            overflow-y: auto;
            flex: 1 1 auto;
            padding-bottom: 10px
        }

        .ftree {
            overflow: auto;
            /* A quarter of the rail. Files grew to fill whatever was left,
               which pushed the projects out of view, and the projects are the
               thing the rail is for. */
            flex: 0 0 25%;
            padding: 2px 10px 12px;
            min-height: 90px
        }

        /* A path that wraps to three lines in a 290px rail is a path you stop
           reading. Truncate and put the full name in the tooltip. */
        .ftree .tree-item,
        .ftree .tree-dir>summary {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .ftree .tree-children {
            margin-left: 10px;
            padding-left: 6px;
            border-left: 1px solid var(--line)
        }

        .ftree .tree-item {
            padding: 3px 0;
            font-size: 12.5px
        }

        .ftree .tree-item.on {
            background: #1d222c;
            border-radius: 4px;
            padding-left: 4px;
            margin-left: -4px
        }

        /* A file the assistant just wrote. It stays marked until you open it,
           so a change made while you were reading something else does not
           scroll past unnoticed. */
        .ftree .tree-item.touched>.lnk::after {
            content: "changed";
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .04em;
            color: #0f1115;
            background: var(--acc);
            border-radius: 3px;
            padding: 1px 4px;
            margin-left: 6px;
            vertical-align: 1px
        }

        .ftree .tree-dir.hastouch>summary>.tree-name::after {
            content: "•";
            color: var(--acc);
            margin-left: 5px;
            font-weight: 700
        }

        .fhist {
            background: #20252f;
            color: var(--dim);
            border: 1px solid var(--line);
            border-radius: 4px;
            font: inherit;
            font-size: 11px;
            max-width: 96px;
            padding: 2px 4px
        }

        .fmode {
            background: #20252f;
            color: var(--dim);
            border: 1px solid var(--line);
            border-radius: 4px;
            font: inherit;
            font-size: 11px;
            min-width: 136px;
            padding: 2px 4px
        }

        .ftbar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0 8px
        }

        .ftbar .dst {
            color: var(--faint);
            font-size: 11px
        }

        .dropzone {
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            margin: 8px 0;
            background: #11151a;
            color: var(--faint);
            font-size: 12px
        }

        .dropzone.drag {
            border-color: var(--acc);
            background: #171a21;
            color: var(--ink)
        }

        .ftree .tree-dir>summary {
            padding: 3px 0;
            font-size: 12.5px;
            color: var(--dim)
        }

        .ftree .rlabel {
            color: var(--faint);
            font-size: 10.5px;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin: 8px 0 2px
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px
        }

        .dot.chatdone {
            width: 9px;
            height: 9px;
            margin-right: 7px;
            background: var(--ok);
            box-shadow: 0 0 0 2px rgba(67, 191, 84, .12);
            vertical-align: middle
        }

        .dot.chatbusy {
            width: 9px;
            height: 9px;
            margin-right: 7px;
            background: var(--warn);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, .18);
            vertical-align: middle
        }

        /* ---- main ---- */
        .main {
            overflow-y: auto;
            padding: 0 0 60px
        }

        /* ---- right rail: chat, always there ---- */
        .crail {
            background: var(--rail);
            border-left: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .app.nochat .crail {
            display: none
        }

        .chead {
            padding: 13px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto
        }

        /* The context line is the point of the rail. It states, in the
           assistant's own words, what it was told you are looking at. If it is
           wrong you can see that it is wrong before you spend a turn on it. */
        .cctx {
            padding: 8px 14px;
            border-bottom: 1px solid var(--line);
            font-size: 11.5px;
            color: var(--dim);
            background: var(--panel);
            flex: 0 0 auto
        }

        .chatattach {
            padding: 8px 14px 0;
            color: var(--faint);
            font-size: 11px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center
        }

        .chatattach .label {
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .atag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 7px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #151922;
            color: var(--ink);
            font-size: 10.5px;
            cursor: pointer;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .atag:hover {
            border-color: var(--acc)
        }

        .atag .x {
            color: var(--faint);
            font-size: 11px
        }

        .cscroll {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px 14px
        }

        .turn {
            margin-bottom: 14px
        }

        .turn .q {
            color: var(--dim);
            font-size: 12px;
            border-left: 2px solid var(--line);
            padding-left: 8px;
            margin-bottom: 6px;
            white-space: pre-wrap
        }

        .turn .a {
            font-size: 13px;
            line-height: 1.5
        }

        /* Rendered answer. Portfolio questions come back as tables and lists,
           and a table shown as pipe characters is a table you will not read. */
        .turn .a p {
            margin: 0 0 8px
        }

        .turn .a ul,
        .turn .a ol {
            margin: 0 0 8px;
            padding-left: 18px
        }

        .turn .a li {
            margin-bottom: 3px
        }

        .turn .a h3 {
            font-size: 13px;
            margin: 10px 0 5px
        }

        .turn .a code {
            background: var(--line);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px
        }

        .turn .a pre {
            background: var(--line);
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0 0 8px
        }

        .turn .a pre code {
            background: none;
            padding: 0
        }

        .turn .a table {
            border-collapse: collapse;
            font-size: 12px;
            margin: 0 0 8px;
            width: 100%
        }

        .turn .a th,
        .turn .a td {
            border: 1px solid var(--line);
            padding: 3px 6px;
            text-align: left
        }

        .turn .a th {
            color: var(--dim);
            font-weight: 600
        }

        /* What it did, above what it concluded. On portfolio data the step list
           is the provenance: you can see which file the number came from. */
        .turn .steps {
            margin-bottom: 7px;
            font-size: 11px
        }

        .turn .steps details {
            border-left: 2px solid var(--accent);
            padding-left: 8px;
            margin-bottom: 3px
        }

        .turn .steps summary {
            color: var(--dim);
            cursor: pointer;
            list-style: none
        }

        .turn .steps summary::-webkit-details-marker {
            display: none
        }

        .turn .steps details.bad {
            border-left-color: var(--stop)
        }

        .turn .steps pre {
            margin: 4px 0 0;
            color: var(--dim);
            white-space: pre-wrap;
            font-size: 11px
        }

        .turn .meta {
            font-size: 11px;
            color: var(--dim);
            margin-top: 5px
        }

        .cfoot {
            border-top: 1px solid var(--line);
            padding: 10px 14px;
            flex: 0 0 auto
        }

        /* A grip above the box, not the native corner grip. The native one is
           8px in a corner that sits next to the send button, and it does not
           persist. This one is the full width of the panel and remembers. */
        .cgrip {
            height: 9px;
            margin: -10px -14px 6px;
            cursor: row-resize;
            position: relative
        }

        .cgrip::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 4px;
            width: 34px;
            margin-left: -17px;
            height: 2px;
            border-radius: 2px;
            background: var(--line);
            transition: background .12s
        }

        .cgrip:hover::after,
        .cgrip.dragging::after {
            background: var(--acc)
        }

        body.rowdrag {
            cursor: row-resize;
            user-select: none
        }

        .cfoot textarea {
            width: 100%;
            box-sizing: border-box;
            /* Height is driven by the grip, so the native corner handle would
               be a second control fighting the first. */
            resize: none;
            background: var(--panel);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            font-size: 13px
        }

        .cfoot select {
            background: var(--panel);
            color: var(--dim);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 4px 6px;
            font: inherit;
            font-size: 11.5px
        }

        .topbar {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 4;
            border-bottom: 1px solid var(--line);
            padding: 14px 26px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .tab {
            background: var(--panel);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 12.5px;
            cursor: pointer
        }

        .tab:hover {
            border-color: #3a4150
        }

        .tab.on {
            background: var(--ink);
            color: #0f1115;
            border-color: var(--ink);
            font-weight: 600
        }

        .spacer {
            flex: 1
        }

        .wrap {
            padding: 22px 26px;
            max-width: 1180px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 650
        }

        .lede {
            color: var(--dim);
            font-size: 13.5px;
            margin: 0 0 18px
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 16px 18px;
            margin-bottom: 16px
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 13px;
            color: var(--dim);
            letter-spacing: .06em;
            text-transform: uppercase;
            font-weight: 600
        }

        .charter {
            border-left: 3px solid var(--acc)
        }

        .crow {
            display: grid;
            grid-template-columns: 104px 1fr;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #1e222b;
            font-size: 13.5px
        }

        .crow:last-child {
            border-bottom: 0
        }

        .ck {
            color: var(--faint);
            font-size: 11.5px;
            letter-spacing: .05em;
            text-transform: uppercase;
            padding-top: 2px
        }

        .gap {
            color: var(--warn);
            font-style: italic
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13.5px
        }

        th,
        td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #1e222b;
            vertical-align: top
        }

        th {
            color: var(--faint);
            font-size: 11px;
            letter-spacing: .05em;
            text-transform: uppercase;
            font-weight: 600
        }

        tr:last-child td {
            border-bottom: 0
        }

        td.num {
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .chip {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            color: #0f1115;
            margin-right: 4px
        }

        .lnk {
            color: var(--info);
            cursor: pointer;
            text-decoration: none
        }

        .lnk:hover {
            text-decoration: underline
        }

        .missing {
            color: var(--stop)
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px;
            color: var(--faint);
            word-break: break-all
        }

        .empty {
            color: var(--faint);
            font-size: 13px;
            padding: 6px 0
        }

        .tree-root {
            display: grid;
            gap: 8px
        }

        .tree-item {
            padding: 2px 0;
            display: flex;
            align-items: baseline;
            gap: 8px
        }

        .tree-item .why {
            font-size: 11.5px
        }

        td.tnum {
            color: var(--faint);
            width: 1%;
            white-space: nowrap;
            padding-right: 10px
        }

        /* ---- preview panel ----
           Its own column, full height, so a file is read beside the project
           rather than inside a card that pushes the project off screen. */
        .prev {
            background: var(--rail);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0
        }

        .fhead {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            flex: 0 0 auto
        }

        .fname {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 0
        }

        .fbody2 {
            flex: 1 1 auto;
            overflow: auto;
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        .fbody2 iframe {
            border: 0;
            width: 100%;
            height: 100%;
            flex: 1 1 auto;
            background: #fff
        }

        .fbody2 img {
            max-width: 100%;
            display: block;
            margin: 0 auto
        }

        /* Rendered markdown gets a readable measure, not the full panel width. */
        .fread {
            padding: 18px 22px;
            overflow: auto;
            max-width: 74ch
        }

        textarea.fedit {
            width: 100%;
            box-sizing: border-box;
            flex: 1 1 auto;
            min-height: 0;
            resize: none;
            border: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            padding: 12px;
            outline: none;
            tab-size: 4
        }

        .ffoot {
            padding: 6px 12px;
            border-top: 1px solid var(--line);
            flex: 0 0 auto
        }

        .fempty {
            padding: 22px;
            color: var(--faint)
        }

        .tree-dir {
            border: 1px solid #1e222b;
            border-radius: 8px;
            padding: 8px 10px;
            background: #13161c
        }

        .tree-dir>summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: baseline;
            gap: 8px
        }

        .tree-dir>summary::-webkit-details-marker {
            display: none
        }

        .tree-name {
            color: var(--ink)
        }

        .tree-path {
            color: var(--faint);
            font-size: 11.5px;
            word-break: break-all
        }

        .tree-children {
            margin: 8px 0 0 12px;
            padding-left: 12px;
            border-left: 1px solid #1e222b;
            display: grid;
            gap: 6px
        }

        .bars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px
        }

        .stat {
            background: #13161c;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 12px 14px
        }

        .stat .v {
            font-size: 22px;
            font-weight: 650;
            font-variant-numeric: tabular-nums
        }

        .stat .k {
            color: var(--faint);
            font-size: 11.5px;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        .stat .n {
            color: var(--dim);
            font-size: 12px;
            margin-top: 4px
        }

        .why {
            color: var(--faint);
            font-size: 12px
        }

        .rsn {
            width: 100%;
            min-width: 190px;
            background: #0f1115;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--ink);
            font: inherit;
            font-size: 12.5px
        }

        .vrow {
            display: flex;
            gap: 5px;
            margin-top: 6px
        }

        .vb {
            background: #20252f;
            color: var(--dim);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11.5px;
            cursor: pointer
        }

        .vb:hover {
            border-color: #3a4150;
            color: var(--ink)
        }

        .vb.kill:hover {
            border-color: var(--stop);
            color: var(--stop)
        }

        /* ---- editing ---- */
        .ed {
            background: #0f1115;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            width: 100%
        }

        .ed:focus {
            outline: none;
            border-color: var(--acc)
        }

        textarea.ed {
            resize: vertical;
            min-height: 52px;
            line-height: 1.5
        }

        .edit-on .crow span.val {
            display: none
        }

        .crow .val {
            white-space: pre-wrap
        }

        .hint {
            color: var(--faint);
            font-size: 11.5px;
            margin-top: 5px
        }

        .toolbar {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-left: auto
        }

        /* A filter group reads as one control, so the buttons sit tight together
           and are separated from the actions beside them. */
        .fgroup {
            display: flex;
            gap: 4px;
            align-items: center;
            padding-right: 7px;
            margin-right: 2px;
            border-right: 1px solid var(--line)
        }

        .fgroup .sm .why {
            margin-left: 4px;
            font-size: 10.5px
        }

        /* The count on the selected button sits on the accent fill, where the
           faint grey used elsewhere is unreadable. */
        .fgroup .sm.pri .why {
            color: #0f1115;
            opacity: .72
        }

        .sm {
            background: #20252f;
            color: var(--dim);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11.5px;
            cursor: pointer
        }

        .sm:hover {
            border-color: #3a4150;
            color: var(--ink)
        }

        .sm.pri {
            background: var(--acc);
            color: #0f1115;
            border-color: var(--acc);
            font-weight: 650
        }

        .card h2 {
            display: flex;
            align-items: center
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px
        }

        .drow {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px
        }

        .dqs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px
        }

        .fl {
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--dim);
            font-size: 12.5px
        }

        .saved {
            color: var(--ok);
            font-size: 11.5px;
            margin-left: 8px
        }

        .flag {
            display: flex;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid #1e222b;
            font-size: 13.5px
        }

        .flag:last-child {
            border-bottom: 0
        }

        .flag .b {
            width: 3px;
            border-radius: 2px;
            flex: none
        }

        /* ---- focus ----
           Bottom left, not bottom right. The chat rail owns the right edge now,
           and a floating timer parked on top of the conversation makes the thing
           you are reading unreachable. The left rail is board navigation, which
           you glance at rather than read, so an overlay costs less there. */
        .focus {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 274px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .45)
        }

        .fhead {
            padding: 11px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px
        }

        /* Drag by the header. The body holds a text box and buttons, so making
           the whole panel a drag handle would fight every click in it. */
        #fdrag {
            cursor: grab
        }

        #fdrag.dragging {
            cursor: grabbing
        }

        /* In its own window the panel is the whole document, so the floating
           chrome is wrong: no shadow, no rounding, no drag, and it fills. */
        body.pip .focus {
            position: static;
            width: auto;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            height: 100vh
        }

        body.pip #fdrag {
            cursor: default
        }

        body.pip #fpop,
        body.pip #fhome,
        body.pip #fold {
            display: none
        }

        .fhead b {
            font-size: 12.5px;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--dim)
        }

        .fbody {
            padding: 14px
        }

        .clock {
            font-size: 38px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: center;
            letter-spacing: .02em
        }

        .phase {
            text-align: center;
            color: var(--acc);
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 6px
        }

        .sessions {
            text-align: center;
            color: var(--faint);
            font-size: 11px;
            margin-top: 2px;
            min-height: 14px
        }

        .ctx {
            text-align: center;
            color: var(--dim);
            font-size: 12.5px;
            margin-top: 2px;
            min-height: 18px
        }

        .scopebar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            justify-content: center
        }

        .scope {
            color: var(--faint);
            font-size: 11.5px;
            letter-spacing: .04em;
            text-transform: uppercase
        }

        .cands {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .cand {
            background: #13161c;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12.5px
        }

        .cand:hover {
            border-color: var(--acc)
        }

        .cand .t {
            font-weight: 550
        }

        .cand .r {
            color: var(--faint);
            font-size: 11.5px;
            margin-top: 2px
        }

        .frow {
            display: flex;
            gap: 7px;
            margin-top: 12px
        }

        .btn {
            flex: 1;
            background: var(--acc);
            color: #0f1115;
            border: 0;
            border-radius: 7px;
            padding: 8px;
            font-size: 12.5px;
            font-weight: 650;
            cursor: pointer
        }

        .btn.ghost {
            background: transparent;
            color: var(--dim);
            border: 1px solid var(--line);
            font-weight: 500
        }

        .capture {
            width: 100%;
            margin-top: 10px;
            background: #0f1115;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 8px 10px;
            color: var(--ink);
            font-size: 12.5px;
            font-family: inherit;
            resize: vertical;
            min-height: 34px
        }

        .caplbl {
            color: var(--faint);
            font-size: 11px;
            margin-top: 9px
        }

        .mini {
            background: none;
            border: 0;
            color: var(--faint);
            cursor: pointer;
            font-size: 16px;
            margin-left: auto;
            line-height: 1
        }

        .collapsed .fbody {
            display: none
        }
    </style>
</head>

<body>
    <div class="app noprev" id="app">

        <aside class="rail">
            <div class="brand"><i class="hex"></i><b>HiveFrame</b><span id="cnt"></span></div>
            <div class="railhead">Projects</div>
            <div class="plist" id="plist"></div>
            <div class="railhead railsplit">Files<select class="fhist" id="fhist"
                    title="Files you have opened in this project"></select><button class="sm" id="ftreerefresh"
                    title="Re-read this project's folders">Refresh</button></div>
            <div class="ftree" id="ftree"></div>
            <div class="railfoot" id="railfoot"></div>
        </aside>

        <div class="gutter g-rail" data-drag="rail"></div>

        <div class="main">
            <div class="topbar">
                <button class="tab on" data-v="project">Project</button>
                <button class="tab" data-v="brief">Brief</button>
                <button class="tab" data-v="triage">Triage</button>
                <button class="tab" data-v="tools">Tools</button>
                <button class="tab" data-v="capacity">Capacity</button>
                <span class="spacer"></span>
                <button class="tab" id="chattoggle" title="Show or hide chat">Chat</button>
                <span class="why" id="stamp"></span>
            </div>
            <div class="wrap" id="view"></div>
        </div>

        <div class="gutter g-prev" data-drag="prev"></div>

        <aside class="prev" id="prev"></aside>

        <div class="gutter g-chat" data-drag="chat"></div>

        <aside class="crail" id="crail">
            <div class="chead">
                <i class="hex" style="width:12px;height:14px"></i>
                <b>Ask</b>
                <span class="spacer"></span>
                <button class="mini" id="cnew"
                    title="Drop the thread. Use it when the subject changes, not to save credits.">Clear</button>
            </div>
            <div class="cctx" id="cctx">Checking...</div>
            <div class="chatattach" id="chatattach"></div>
            <div class="cscroll" id="cscroll"></div>
            <div class="cfoot">
                <div class="cgrip" id="cgrip" title="Drag to resize the message box"></div>
                <textarea id="cprompt" rows="3"
                    placeholder="Ask about what you are looking at. Enter to send."></textarea>
                <div class="row" style="margin-top:7px;align-items:center;gap:8px">
                    <button id="csend">Send</button>
                    <button id="cstop" class="mini" style="display:none">Stop</button>
                    <select id="cmodel" title="Heavier models cost more per turn"></select>
                    <span class="why" id="cstat"></span>
                </div>
            </div>
        </aside>
    </div>

    <div class="focus" id="focus">
        <div class="fhead" id="fdrag">
            <i class="hex" style="width:12px;height:14px"></i>
            <b>Focus</b>
            <span class="spacer"></span>
            <button class="mini" id="fpop" title="Move this into its own always-on-top window">Pop out</button>
            <button class="mini" id="fhome" title="Move it back to the bottom left of the page">Reset spot</button>
            <button class="mini" id="fold">-</button>
        </div>
        <div class="fbody">
            <div class="clock" id="clock">25:00</div>
            <div class="phase" id="phase">Work</div>
            <div class="sessions" id="sessions">0 work sessions complete</div>
            <div class="ctx" id="ctx">Nothing selected</div>
            <div class="scopebar">
                <span class="scope" id="scope">Task focus</span>
                <button class="sm" id="projfocus" title="Point the timer at the whole project">Project</button>
            </div>
            <div class="cands" id="cands"></div>
            <div class="frow">
                <button class="btn" id="go">Start</button>
                <button class="btn ghost" id="lunch">Lunch</button>
                <button class="btn ghost" id="reset">Reset</button>
            </div>
            <div class="caplbl">Interruption. Type it, keep going.</div>
            <textarea class="capture" id="capture" placeholder="Park the thought here"></textarea>
        </div>
    </div>

    <script>
        const HZ = { H1: "#4c9aff", H2: "#f2994a", H3: "#9b51e0" };

        /* Plain-English labels for the stored field names.

           The file keeps short keys because they are typed by hand and read by
           code. The screen shows the question the field actually answers, because
           a reader who has to be told what "kill_when" means will not fill it in.
           One map, used by the charter rows and by the missing-field warnings, so
           the two can never disagree. */
        const FIELD_LABEL = {
            problem: "What is wrong today",
            hypothesis: "What we think will fix it",
            goal: "What good looks like",
            kill_when: "We stop if",
            done_when: "We are finished when",
            stop_when: "This ends when",
            constraints: "Limits we work within"
        };
        const HZ_MEANS = {
            H1: "Horizon 1: running the business now",
            H2: "Horizon 2: the next one to two years",
            H3: "Horizon 3: longer-term bets"
        };
        const fieldLabel = k => FIELD_LABEL[k] || k.replace(/_/g, " ");

        /* Task numbers.

           A task's real identity is its id, which is a slug like
           "chase-ritm": stable, but nobody says it out loud. The number is a
           handle for talking, so "do 3" and "what is 3 waiting on" both work
           without reading a slug back.

           Deliberately scoped to the selected project and recomputed on every
           draw. A board-wide number would have to stay stable across a project
           being added or a task being dropped, and a number that silently
           points at something else is worse than no number. Within one project,
           in the order shown, the number is exactly what is on screen.

           TNUM maps id to number, TIDX maps number to task, so the display and
           the assistant cannot disagree about which task is which. */
        let TNUM = {}, TIDX = {};

        function numberTasks(p) {
            TNUM = {}; TIDX = {};
            let n = 0;
            (p.tasks || []).forEach(t => {
                if (t.status !== "open" && t.status !== "doing") return;
                n += 1; TNUM[t.id] = n; TIDX[n] = t;
            });
            return n;
        }

        /* Which statuses the moves table shows.

           Filtering is display only. Numbering, blocker resolution and every
           count still run over the whole task list, because a filter that also
           changed the numbers would make "do 3" mean something different
           depending on a button nobody remembers pressing.

           Default is every status, so opening a project hides nothing. The
           choice is remembered, since a filter you have to set again each time
           is one you stop using. */
        const TFILTER_KEY = "hiveframe.taskfilter";
        const TFILTERS = [
            ["all", "All", null],
            ["live", "Open", ["open", "doing"]],
            ["doing", "Doing", ["doing"]],
            ["done", "Done", ["done"]],
            ["dropped", "Dropped", ["dropped"]],
        ];
        let TFILTER = "all";
        try {
            const saved = localStorage.getItem(TFILTER_KEY);
            if (TFILTERS.some(f => f[0] === saved)) TFILTER = saved;
        } catch (e) { }

        const IMPORT_KEY = "hiveframe.importmode";
        let IMPORT_MODE = "project";
        let IMPORT_MODE_SAVED = false;
        try {
            const saved = localStorage.getItem(IMPORT_KEY);
            if (saved === "task" || saved === "project") {
                IMPORT_MODE = saved;
                IMPORT_MODE_SAVED = true;
            }
        } catch (e) { }

        function setTaskFilter(k) {
            TFILTER = k;
            try { localStorage.setItem(TFILTER_KEY, k); } catch (e) { }
            draw();
        }

        function setImportMode(k) {
            IMPORT_MODE = k === "task" ? "task" : "project";
            IMPORT_MODE_SAVED = true;
            try { localStorage.setItem(IMPORT_KEY, IMPORT_MODE); } catch (e) { }
        }

        function taskFilterMatch(t) {
            const f = TFILTERS.find(x => x[0] === TFILTER);
            return !f || !f[2] || f[2].includes(t.status);
        }

        /* Counts on the buttons, so an empty result reads as "none in that
           status" rather than as a broken table. */
        function taskFilterCount(p, k) {
            const f = TFILTERS.find(x => x[0] === k);
            return (p.tasks || []).filter(t => !f || !f[2] || f[2].includes(t.status)).length;
        }

        /* Only a blocker that is still open is a blocker.

           The table used to print every id in blocked_by, so a task whose
           dependency had been finished or dropped still read "waiting on
           explain-server-wedge" while ranking as startable. The screen said
           stop and the ranking said go. Numbering the tasks is what made it
           visible, because the referenced number was not in the list. */
        function liveBlockers(t) {
            return (t.blocked_by || []).filter(b => TNUM[b]);
        }

        let BOARD = null, SEL = null, VIEW = "project";
        let PENDING_FOCUS = null;

        async function load() {
            const r = await fetch("/api/board?stores=work");
            BOARD = await r.json();
            if (PENDING_FOCUS && PENDING_FOCUS.projectId && BOARD.projects.some(p => p.id === PENDING_FOCUS.projectId)) {
                SEL = PENDING_FOCUS.projectId;
            }
            if (!SEL && BOARD.projects.length) SEL = BOARD.projects[0].id;
            clearChatDone(SEL);
            drawRail(); draw(); drawCandidates();
            if (PENDING_FOCUS) hydrateFocusFromBoard();
        }

        function proj(id) { return BOARD.projects.find(p => p.id === id); }

        /* ---- the rail, grouped by program ----
           A flat ranked list was the right first shape and the wrong second one.
           It answered "what is highest priority" and hid "what belongs to what",
           which is the question a portfolio exists to answer. Programs group
           their projects; a project with no program stands on its own; and
           operations sit last in their own group, because they are the tax
           taken off the top rather than candidates ranked against the work.

           A program is ordered by its best child, not by its own score. Its own
           score is near meaningless, since the work lives in the children, and
           ranking a container by an empty task list buries a live program under
           a small standalone project. */
        const GROUP_KEY = "hiveframe.groupsclosed";
        let GROUPS_CLOSED = {};
        try { GROUPS_CLOSED = JSON.parse(localStorage.getItem(GROUP_KEY) || "{}"); } catch (e) { }

        function toggleGroup(k) {
            GROUPS_CLOSED[k] = !GROUPS_CLOSED[k];
            try { localStorage.setItem(GROUP_KEY, JSON.stringify(GROUPS_CLOSED)); } catch (e) { }
            drawRail();
        }

        function railGroups() {
            const ps = BOARD.projects;
            const kids = (BOARD.hierarchy && BOARD.hierarchy.children) || {};
            const groups = [];

            const childrenOf = id => (kids[id] || []).map(proj).filter(Boolean)
                .filter(c => c.tier !== "operation")
                .sort((a, b) => b.score - a.score);

            ps.filter(p => p.tier === "program")
                .map(p => ({ key: p.id, head: p, items: childrenOf(p.id) }))
                .forEach(g => groups.push(g));

            /* Ordered by the best child so a live program cannot be buried by a
               container score of nearly zero. A program with no children still
               shows, because an empty program is a finding. */
            groups.sort((a, b) => (b.items[0] ? b.items[0].score : b.head.score)
                - (a.items[0] ? a.items[0].score : a.head.score));

            const loose = ps.filter(p => p.tier === "project" && !p.parent)
                .sort((a, b) => b.score - a.score);
            if (loose.length) groups.push({
                key: "_loose", label: "Misc",
                note: "not under a program", items: loose
            });


            const ops = ps.filter(p => p.tier === "operation").sort((a, b) => b.score - a.score);
            if (ops.length) groups.push({
                key: "_ops", label: "Operations",
                note: "taken off the top, not ranked against the work", items: ops
            });

            /* Anything the hierarchy could not place. Better shown in an ugly
               bucket than silently absent from the rail. */
            const shown = new Set(groups.flatMap(g => g.items.map(i => i.id))
                .concat(groups.map(g => g.head && g.head.id).filter(Boolean)));
            const orphans = ps.filter(p => !shown.has(p.id));
            if (orphans.length) groups.push({
                key: "_orphan", label: "Unplaced",
                note: "parent missing or at the wrong altitude", items: orphans
            });
            return groups;
        }

        function pitem(p, indent) {
            return `
    <div class="pitem${p.id === SEL ? " on" : ""}${indent ? " sub" : ""}" onclick="pick('${p.id}')">
      <div class="pname">${hasChatBusy(p.id) ? `<i class="dot chatbusy" title="Chat in progress. An agent is working."></i>` : ""}${hasChatDone(p.id) ? `<i class="dot chatdone" title="Chat completed. Open this project."></i>` : ""}${p.name}</div>
      <div class="pmeta">
        ${p.horizon ? `<span class="hz" title="${HZ_MEANS[p.horizon] || ""}" style="background:${HZ[p.horizon] || "#555"}">${p.horizon}</span>` : ""}
        ${p.kind} · ${p.open_tasks} open${p.next_due ? ` · due ${p.next_due}` : ""}
      </div>
      <div class="pmeta">${p.stalled
                    ? `<span class="chip" style="background:var(--stop)">nothing can start today</span>`
                    : (p.next_move ? `next: ${p.next_move.title}${p.next_move.effort_h ? ` (${p.next_move.effort_h}h)` : ""}` : "")}
      </div>
      <div class="pscore" title="Priority score">${p.score}</div>
    </div>`;
        }

        /* A program's own line reports its children's state, not its task list.
           A program with nothing open of its own is not idle if three projects
           beneath it are moving. */
        function programHead(g) {
            const p = g.head, r = p.rollup || {};
            const closed = !!GROUPS_CLOSED[g.key];
            const bits = [];
            const busy = g.items.some(x => hasChatBusy(x.id));
            const done = g.items.some(x => hasChatDone(x.id));
            if (r.children) bits.push(`${r.live || 0} of ${r.children} live`);
            else bits.push("no projects yet");
            if (r.blocked) bits.push(`${r.blocked} blocked`);
            if (r.stalled) bits.push(`${r.stalled} stalled`);
            if (r.open_effort_h) bits.push(`${r.open_effort_h}h open`);
            return `
    <div class="ghead${closed ? " closed" : ""}" onclick="toggleGroup('${g.key}')">
      <span class="gtwist">${closed ? "▸" : "▾"}</span>
      <span class="gname${p.id === SEL ? " on" : ""}"
            onclick="event.stopPropagation();pick('${p.id}')"
            title="Open this program. Click anywhere else on this row to collapse it.">${busy ? `<i class="dot chatbusy" title="A child project has an active chat."></i>` : ""}${done ? `<i class="dot chatdone" title="A child project has a finished chat."></i>` : ""}${p.name}</span>
      <span class="gtag">program${closed ? ` · ${g.items.length}` : ""}</span>
      <div class="gmeta">${bits.join(" · ")}</div>
    </div>`;

        }

        function drawRail() {
            document.getElementById("cnt").textContent = BOARD.projects.length;
            document.getElementById("plist").innerHTML = railGroups().map(g => {
                const closed = !!GROUPS_CLOSED[g.key];
                const head = g.head ? programHead(g) : `
    <div class="ghead plain${closed ? " closed" : ""}" onclick="toggleGroup('${g.key}')">
      <span class="gtwist">${closed ? "▸" : "▾"}</span>
      <span class="gname">${g.label}</span>
      <span class="gtag">${g.items.length}</span>
      ${g.note ? `<div class="gmeta">${g.note}</div>` : ""}
    </div>`;

                const body = closed ? "" : (g.items.map(p => pitem(p, !!g.head)).join("")
                    || `<div class="empty" style="padding:4px 16px 8px">Nothing under this program.</div>`);
                return head + body;
            }).join("");

            const v = BOARD.vpn, c = BOARD.capacity;
            document.getElementById("railfoot").innerHTML =
                `<div><i class="dot" style="background:${v.tunnel ? "var(--ok)" : "var(--stop)"}"></i>${v.label}</div>
     <div style="margin-top:5px"><i class="dot" style="background:${c.overcommitted ? "var(--stop)" : "var(--ok)"}"></i>
     ${c.committed_h}h promised of ${c.available_h}h free in the next ${c.window_days} days</div>`;
            /* This label was "read-only" long after that stopped being true.
               A posture claim that nobody re-checks is worse than no claim,
               because it is the line someone would quote. What is actually
               true: every production system is still read-only, and the only
               things written are files on this laptop. */
            document.getElementById("stamp").textContent =
                "Loaded " + BOARD.generated + " · writes local files only, no live system";
            drawFiles();
        }


        /* One place that changes tab, so the button highlight can never disagree
           with what is on screen. */
        function setView(v) {
            VIEW = v;
            document.querySelectorAll(".tab[data-v]").forEach(x => x.classList.toggle("on", x.dataset.v === v));
            draw();
            if (v === "triage") loadLog();
            paintCtx();
        }

        /* Switching project closes the open file. Leaving it open would show one
           project's file under another project's heading, which is precisely the
           bleed this tool exists to stop.

           Picking a project also returns you to Project. A link on the Triage or
           Capacity tab is a request to go look at that project, and selecting it
           silently behind a summary table answers a question nobody asked. */
        function pick(id) {
            if (FILE && FILE_DIRTY && !confirm("Unsaved changes to " + (FILE.rel || FILE.name) + " will be lost. Switch anyway?")) return;
            SEL = id; FILE = null; FILE_DIRTY = false;
            clearChatDone(id);
            drawRail(); syncChatProject();
            showPrev(false); drawPrev();
            setView("project");
        }



        function draw() {
            const el = document.getElementById("view");
            if (VIEW === "brief") { el.innerHTML = briefView(); loadCarry(); return; }
            if (VIEW === "triage") return el.innerHTML = triageView();
            if (VIEW === "tools") return el.innerHTML = toolsView();
            if (VIEW === "capacity") return el.innerHTML = capView();
            el.innerHTML = projectView();
        }

        /* ---- chat: the Copilot CLI in a rail, not a tab ----
           HiveFrame does not implement an assistant. It shells out to `copilot`,
           which already has tool access, an authenticated session and a permission
           model. A chat box without tool access is a worse terminal, and rebuilding
           tool access is weeks of work to duplicate something already installed.

           It lives in a rail rather than a tab because a question arrives while you
           are looking at something. A tab makes you leave the thing you wanted to
           ask about, and by the time you arrive you are describing it from memory. */

        let CHAT = null, TURNS = [], CHAT_PROJ = null;
        let CHAT_BUSY_PROJECT = null;
        const CHAT_DONE_KEY = "hiveframe.chatdone";
        let CHAT_DONE = {};
        try { CHAT_DONE = JSON.parse(localStorage.getItem(CHAT_DONE_KEY) || "{}"); } catch (e) { CHAT_DONE = {}; }
        const CHAT_ATTACH_KEY = "hiveframe.chatattachments";
        let CHAT_ATTACH = {};
        try { CHAT_ATTACH = JSON.parse(localStorage.getItem(CHAT_ATTACH_KEY) || "{}"); } catch (e) { CHAT_ATTACH = {}; }
        /* Keyed by project id: the tree follows focus, so one cached copy of
           "everything" would be the bleed this view exists to prevent. */
        let TREE = {};

        function hasChatDone(id) {
            return !!(id && CHAT_DONE[id]);
        }

        function hasChatBusy(id) {
            return !!(id && CHAT_BUSY_PROJECT === id);
        }

        function setChatBusy(id) {
            CHAT_BUSY_PROJECT = id || null;
            drawRail();
        }

        function clearChatDone(id) {
            if (!id || !CHAT_DONE[id]) return;
            delete CHAT_DONE[id];
            try { localStorage.setItem(CHAT_DONE_KEY, JSON.stringify(CHAT_DONE)); } catch (e) { }
        }

        function treeHasPath(node, target) {
            if (!node || !target) return false;
            if (node.kind === "file" && node.path === target) return true;
            return (node.children || []).some(child => treeHasPath(child, target));
        }

        function chatAttachList(id = SEL) {
            const list = id && Array.isArray(CHAT_ATTACH[id]) ? CHAT_ATTACH[id] : [];
            const tree = id && TREE[id];
            if (!tree || !tree.roots) return list;
            return list.filter(p => (tree.roots || []).some(r => treeHasPath(r.tree, p)));
        }

        function saveChatAttach() {
            try { localStorage.setItem(CHAT_ATTACH_KEY, JSON.stringify(CHAT_ATTACH)); } catch (e) { }
        }

        function setChatAttach(paths, id = SEL) {
            if (!id) return;
            const uniq = [];
            (paths || []).forEach(p => {
                if (p && !uniq.includes(p)) uniq.push(p);
            });
            if (uniq.length) CHAT_ATTACH[id] = uniq;
            else delete CHAT_ATTACH[id];
            saveChatAttach();
            paintChatAttach();
        }

        function addChatAttach(paths, id = SEL) {
            if (!id || !paths || !paths.length) return;
            const cur = chatAttachList(id);
            const next = cur.slice();
            paths.forEach(p => { if (p && !next.includes(p)) next.push(p); });
            setChatAttach(next, id);
        }

        function clearChatAttach(id = SEL) {
            if (!id || !CHAT_ATTACH[id]) return;
            delete CHAT_ATTACH[id];
            saveChatAttach();
            paintChatAttach();
        }

        function paintChatAttach() {
            const el = document.getElementById("chatattach");
            if (!el) return;
            const list = chatAttachList();
            if (!list.length) {
                el.innerHTML = "";
                return;
            }
            el.innerHTML = `<span class="label">Pasted files</span>` +
                list.map(p => `<span class="atag" title="${esc(p)}" onclick="openFile(${JSON.stringify(p)})">${esc((p.split("/").pop() || p))}<span class="x">↗</span></span>`).join("") +
                `<span class="atag" title="Clear pasted file context" onclick="clearChatAttach()">Clear</span>`;
        }

        function markChatDone(id) {
            if (!id) return;
            CHAT_DONE[id] = Date.now();
            try { localStorage.setItem(CHAT_DONE_KEY, JSON.stringify(CHAT_DONE)); } catch (e) { }
            drawRail();
        }

        /* Answers are model output rendered into the page, so they are escaped.
           Trusting a generated string as HTML is how a helpful tool becomes an
           injection surface. */
        function esc(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        /* Markdown, rendered from already-escaped text.

           Order matters and is the whole safety argument: escape first, then add
           markup. Nothing the model emits can become a tag, because by the time
           any tag is inserted every angle bracket in its output is already an
           entity. This is a deliberately small subset (headings, bold, code,
           lists, tables) rather than a library, because the alternative is a
           dependency in a tool whose point is that it has none. */
        function md(src) {
            const lines = esc(src).split("\n");
            const out = [];
            let i = 0, list = null;

            const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
            const inline = s => s
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

            while (i < lines.length) {
                const ln = lines[i];

                if (/^```/.test(ln)) {
                    closeList();
                    const buf = [];
                    i++;
                    while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
                    i++;
                    out.push(`<pre><code>${buf.join("\n")}</code></pre>`);
                    continue;
                }

                // A table needs its separator row to be a table and not prose
                // that happens to contain a pipe.
                if (/^\s*\|/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
                    closeList();
                    const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
                    const head = cells(ln);
                    i += 2;
                    const body = [];
                    while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
                    out.push("<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("") +
                        "</tr></thead><tbody>" +
                        body.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") +
                        "</tbody></table>");
                    continue;
                }

                let m;
                if ((m = ln.match(/^#{1,6}\s+(.*)$/))) {
                    closeList(); out.push(`<h3>${inline(m[1])}</h3>`); i++; continue;
                }
                if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) {
                    if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
                    out.push(`<li>${inline(m[1])}</li>`); i++; continue;
                }
                if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) {
                    if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
                    out.push(`<li>${inline(m[1])}</li>`); i++; continue;
                }
                if (!ln.trim()) { closeList(); i++; continue; }

                closeList();
                const para = [];
                while (i < lines.length && lines[i].trim() &&
                    !/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) para.push(lines[i++]);
                out.push(`<p>${inline(para.join("\n"))}</p>`);
            }
            closeList();
            return out.join("");
        }

        /* What the assistant is told you are looking at.

           Sent with every turn, so every word is paid for on every turn. Two
           rules keep it small. Terse over grammatical: this is read by a model,
           not a person, and "H2/live/48" costs a fraction of the same fact in a
           sentence. And a pointer beats a paste: the project file is named, and
           the assistant can open it, so copying the charter in is paying for
           the same text twice.

           What stays: the screen, the file path, and the numbered task list.
           The numbers are the one thing not in any file, because they are
           generated by the display, so "do 3" cannot be resolved without them. */
        function screenContext() {
            const L = [];
            const p = SEL && BOARD ? proj(SEL) : null;
            L.push(`HiveFrame ${VIEW} view.`);
            if (p) {
                L.push(`Project: ${p.name} [${p.id}] ${p.tier}/${p.horizon || "-"}/${p.status} score ${p.score} ${p.open_tasks} open.`);
                if (p.source_file) L.push(`File: ${p.source_file}`);
                if (p.folders && p.folders.length)
                    L.push(`Folders: ${p.folders.map(f => f.path).join(" ")}`);

                /* Numbered as the screen shows them. Andy says "do 3", and a
                   wrong guess acts on the wrong work. */
                const nums = numberTasks(p);
                if (nums) {
                    L.push("Open moves as numbered on screen:");
                    for (let i = 1; i <= nums; i++) {
                        const t = TIDX[i];
                        const f = [];
                        if (t.due) f.push(t.due);
                        if (t.effort_h) f.push(t.effort_h + "h");
                        if (t.urgent) f.push("urgent");
                        if (liveBlockers(t).length)
                            f.push("blocked by " + liveBlockers(t).map(b => "#" + TNUM[b]).join("/"));
                        L.push(`${i}. ${t.title} [${t.id}]${f.length ? " (" + f.join(", ") + ")" : ""}`);
                    }
                }
            }
            if (VIEW === "brief" || VIEW === "triage")
                L.push("Ranked: " + BOARD.projects.map(x => `${x.id} ${x.score}`).join(", "));
            if (VIEW === "tools") {
                const orphan = (BOARD.tools || []).filter(t => !(t.used_by || []).length).map(t => t.id);
                L.push(`${(BOARD.tools || []).length} tools. Unused: ${orphan.join(" ") || "none"}`);
            }
            const attach = chatAttachList();
            if (attach.length) {
                L.push("Pasted chat files:");
                attach.forEach(p => L.push(`- ${p}`));
            }
            if (VIEW === "brief" && MORNING_DATA)
                L.push(...morningDataContext());
            /* The permission, stated once. Without it the assistant declines
               work it can do and then invents a path, which reads as
               instructions and is worse than refusing. */
            L.push(`Store: ${(BOARD && BOARD.store_root) || "?"} (one TOML per project).`);
            L.push("You have file tools. Read and edit those paths directly; "
                + "nothing else is reachable. Make requested changes yourself, then say what changed.");
            return L.join("\n");
        }


        function ctxLabel() {
            const p = SEL && BOARD ? proj(SEL) : null;
            const view = VIEW.charAt(0).toUpperCase() + VIEW.slice(1);
            return p ? `Sees: ${view} · ${p.name}` : `Sees: ${view}`;
        }

        function paintCtx() {
            paintChatAttach();
            const el = document.getElementById("cctx");
            if (!el || !CHAT) return;
            if (!CHAT.cli.ok) { el.textContent = "Copilot CLI not found"; return; }
            const spent = TURNS.reduce((a, t) => a + (t.credits || 0), 0);
            el.textContent = ctxLabel() + (spent ? ` · ${spent.toFixed(1)} credits today` : "");
        }

        /* Switching project switches thread.

           A question about one project rarely needs another's history, and an
           answer grounded in the wrong thread is worse than one grounded in
           nothing. This was also believed to be the single biggest lever on
           spend, on one measurement of 3.5 credits fresh against 20.8 deep.
           That reading was the session odometer, not the turn price, so the
           claim does not hold and the separation stands on relevance alone.

           The thread is not lost when you leave it. Each one is stored, so coming
           back to a project shows the conversation the CLI is about to resume,
           rather than an empty box above a session that remembers everything. */
        async function syncChatProject() {
            const id = SEL || null;
            if (CHAT_PROJ === id) return;
            CHAT_PROJ = id;
            const box = document.getElementById("cscroll");
            if (!box || !CHAT || !CHAT.cli.ok) return;
            const p = id && BOARD ? proj(id) : null;
            box.innerHTML = `<p class="empty">Loading thread...</p>`;

            let rows = [];
            try {
                const r = await fetch(`/api/chat/state?store=work&project=${encodeURIComponent(id || "")}`);
                rows = (await r.json()).transcript || [];
            } catch (e) { /* an unreachable transcript is an empty one, not an error dialog */ }

            if (CHAT_PROJ !== id) return;  // you moved on while this was in flight
            box.innerHTML = "";
            if (!rows.length) {
                box.innerHTML = `<p class="empty">${p ? "Thread for " + esc(p.name) + "." : "Board thread."}
      Each project keeps its own conversation, because carrying one into another costs money and confuses the answer.</p>`;
                return;
            }
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].role !== "user") continue;
                const ans = rows[i + 1] && rows[i + 1].role === "assistant" ? rows[i + 1] : null;
                addTurn(rows[i].text, ans ? ans.text : "", ans ?
                    `${ans.seconds}s · ${ans.credits ?? "?"} credits · ${ans.model}` : "", ans && ans.steps);
            }
            box.scrollTop = box.scrollHeight;
        }

        /* ---- draft an instruction from a task ----
           The prompt is loaded into the box rather than sent. A task title is a
           note to yourself, not an instruction to anyone else, so the gap
           between the two is exactly where you correct it. Sending straight
           away would spend credits on a guess.

           The model is picked from the task, not fixed, because the cheapest
           capable model is the standing rule and the spread here is about
           fourteen-fold on an identical prompt. The reason is shown, so a wrong
           pick is visible rather than silent. */
        const HEAVY_WORDS = /\b(design|architect|strategy|strategic|rewrite|refactor|migrat|decide|options?|trade[- ]?off|evaluate|assess|recommend|plan)\b/i;
        const LIGHT_WORDS = /\b(rename|update|tidy|format|list|check|verify|link|typo|copy|move|delete|add a|note)\b/i;

        function pickModel(t) {
            const text = ((t.title || "") + " " + (t.note || ""));
            const h = t.effort_h || 0;
            if (LIGHT_WORDS.test(text) && h <= 1)
                return { id: "gpt-5.4-mini", why: "small and mechanical" };
            if (HEAVY_WORDS.test(text) || h >= 6)
                return { id: "claude-sonnet-4.5", why: "judgment or multi-step work" };
            if (h >= 2) return { id: "claude-sonnet-4.5", why: "over two hours of work" };
            return { id: "gpt-5.4-mini", why: "cheapest model that can do this" };
        }

        function briefTask(id) {
            const p = proj(SEL);
            const t = (p.tasks || []).find(x => x.id === id);
            if (!t) return;
            /* The draft refers to the move by its number, so the numbering has
               to exist before the draft is written. */
            numberTasks(p);

            const m = pickModel(t);
            const sel = document.getElementById("cmodel");
            /* Only if the CLI offers it. A model set to something the CLI does
               not have would fail at send time with no clue why. */
            if (sel && [...sel.options].some(o => o.value === m.id)) sel.value = m.id;

            const c = p.charter || {};
            const blockers = liveBlockers(t).map(b => TNUM[b]).filter(Boolean);

            /* Short on purpose. Everything the screen context already carries
               (project, file path, folders, the numbered move list, the
               permission line) is not repeated here, because it is sent
               alongside this on the same turn and paying twice for the same
               fact buys nothing.

               What is left is the part the context cannot know: which move,
               and what counts as done. */
            const lines = [`Do move #${TNUM[t.id]}: ${t.title}`];
            if (t.note) lines.push(`Context: ${t.note}`);
            if (blockers.length) lines.push(`Blocked by #${blockers.join(", #")}. Say so if that stops you.`);
            if (c.goal) lines.push(`Project goal: ${c.goal}`);
            lines.push("Plan first, in two or three lines, then wait.");

            const box = document.getElementById("cprompt");
            box.value = lines.join("\n");
            /* A twelve-line draft in a three-line box is a draft you will send
               without reading. Grow to fit it, but never shrink: a height you
               chose is not ours to take back. */
            const need = lines.length * 18 + 16;
            if (box.getBoundingClientRect().height < need) setPromptH(need);

            /* Chat may be collapsed. Loading a prompt into a panel you cannot
               see is a button that appears to do nothing. */
            document.getElementById("app").classList.remove("nochat");
            saveLayout();
            box.focus();
            box.setSelectionRange(box.value.length, box.value.length);
            document.getElementById("cstat").textContent =
                `Draft ready · ${m.id} (${m.why}) · edit before sending`;
        }

        async function loadChat() {

            const r = await fetch("/api/chat/state?store=work");
            CHAT = await r.json();
            TURNS = CHAT.history || [];
            const sel = document.getElementById("cmodel");
            if (sel && CHAT.models) {
                sel.innerHTML = CHAT.models.map(m =>
                    `<option value="${m.id}"${m.id === CHAT.model ? " selected" : ""}>${m.id} · ~${m.credits}cr</option>`).join("");
            }
            paintCtx();
            if (!CHAT.cli.ok) {
                document.getElementById("cscroll").innerHTML =
                    `<p class="empty">${esc(CHAT.cli.reason)}. Install with <code>npm i -g @github/copilot</code>.</p>`;
                document.getElementById("csend").disabled = true;
                return;
            }
            CHAT_PROJ = undefined;
            syncChatProject();
        }

        /* A refused step is kept, not hidden. When the assistant is denied a
           verb it matters that you can see which one, because that is the
           guardrail doing its job and it explains a thin answer. */
        function stepsHtml(steps) {
            if (!steps || !steps.length) return "";
            return `<div class="steps">` + steps.map(s => {
                const bad = s.glyph === "✗" || s.glyph === "⚠";
                return `<details${bad ? ' class="bad"' : ""}><summary>${esc(s.glyph || "·")} ${esc(s.title)}</summary>` +
                    (s.detail ? `<pre>${esc(s.detail)}</pre>` : "") + `</details>`;
            }).join("") + `</div>`;
        }

        function addTurn(q, a, meta, steps) {
            const box = document.getElementById("cscroll");
            if (box.querySelector(".empty")) box.innerHTML = "";
            const d = document.createElement("div");
            d.className = "turn";
            d.innerHTML = `<div class="q">${esc(q)}</div>` + stepsHtml(steps) +
                `<div class="a">${md(a)}</div>` +
                (meta ? `<div class="meta">${esc(meta)}</div>` : "");
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
            return d;
        }

        /* One turn, streamed.

           The answer is rendered twice on purpose: as plain text while it
           arrives, because markdown is only parseable once a block is closed and
           a half-parsed table flickers, then as markdown once "done" lands. The
           step list is live, since a slow tool call is exactly the moment you
           want evidence that something is happening. */
        let RUN = null;   // the turn id currently in flight, or null

        function chatBusy(on) {
            document.getElementById("csend").disabled = on;
            document.getElementById("cstop").style.display = on ? "" : "none";
            document.getElementById("cstat").textContent = on ? "Working..." : "";
        }

        async function stopChat() {
            if (!RUN) return;
            document.getElementById("cstat").textContent = "Stopping...";
            await fetch("/api/chat/stop", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: RUN, store: "work" })
            });
        }

        async function sendChat() {
            const box = document.getElementById("cprompt");
            const v = (box.value || "").trim();
            if (!v || !CHAT || !CHAT.cli.ok || RUN) return;
            box.value = "";

            const node = addTurn(v, "", "");
            /* Taken before the turn so the after-state has something to be
               compared against. The project is captured too, because you may
               switch projects while the answer streams. */
            const watchId = SEL;
            const before = mtimeMap(TREE[watchId]);

            const aEl = node.querySelector(".a");
            const stepBox = document.createElement("div");
            stepBox.className = "steps";
            node.querySelector(".q").insertAdjacentElement("afterend", stepBox);
            const scroll = document.getElementById("cscroll");
            const atBottom = () => scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
            let text = "", last = null, stick = true;
            setChatBusy(watchId);
            chatBusy(true);

            let r;
            try {
                r = await fetch("/api/chat/stream", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: v, store: "work", context: screenContext(),
                        project: SEL || "", model: document.getElementById("cmodel").value
                    })
                });
            } catch (e) {
