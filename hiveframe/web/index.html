        function reveal(p) { fetch("/api/open?path=" + encodeURIComponent(p)); }

        /* ---- focus timer: picking is part of the tool ---- */
        const WORK_LEN = 25 * 60;
        const BREAK_LEN = 5 * 60;
        const LUNCH_LEN = 30 * 60;
        const WORKS_PER_LUNCH = 4;
        let LEN = WORK_LEN, left = LEN, phase = "work", sessions = 0, warned1m = false, tick = null, task = null;
        let FOCUS_SCOPE = "task";
        const LAST_TASK_KEY = "hiveframe.focus.lasttask";
        let LAST_TASK_BY_PROJECT = {};
        try { LAST_TASK_BY_PROJECT = JSON.parse(localStorage.getItem(LAST_TASK_KEY) || "{}"); } catch (e) { }
        let FOCUS = document.getElementById("focus");
        const FOCUS_KEY = "hiveframe.focus.timer";
        let AUDIO = null;

        function focusNode() { return FOCUS || document.getElementById("focus"); }
        function focusDoc() {
            const f = focusNode();
            return f && f.ownerDocument ? f.ownerDocument : document;
        }

        function phaseLen(kind) {
            return kind === "break" ? BREAK_LEN : kind === "lunch" ? LUNCH_LEN : WORK_LEN;
        }

        function phaseName(kind) {
            return kind === "break" ? "Break" : kind === "lunch" ? "Lunch" : "Work";
        }

        function audioCtx() {
            const Ctor = window.AudioContext || window.webkitAudioContext;
            if (!Ctor) return null;
            if (!AUDIO) AUDIO = new Ctor();
            return AUDIO;
        }

        async function armAudio() {
            const a = audioCtx();
            if (!a) return;
            try { if (a.state === "suspended") await a.resume(); } catch (e) { }
        }

        function beep(freq, dur, delay = 0, gain = 0.05, type = "sine") {
            const a = audioCtx();
            if (!a || a.state === "closed") return;
            const start = a.currentTime + delay / 1000;
            const osc = a.createOscillator();
            const g = a.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            g.gain.setValueAtTime(0.0001, start);
            g.gain.exponentialRampToValueAtTime(gain, start + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, start + dur / 1000);
            osc.connect(g);
            g.connect(a.destination);
            osc.start(start);
            osc.stop(start + dur / 1000 + 0.05);
        }

        function warnChime() {
            beep(988, 120, 0, 0.06, "square");
        }

        function doneChime() {
            beep(784, 120, 0, 0.05, "square");
            beep(988, 120, 180, 0.05, "square");
        }

        function focusSnapshot() {
            return {
                len: LEN,
                left,
                running: !!tick,
                savedAt: Date.now(),
                phase,
                sessions,
                warned1m,
                scope: FOCUS_SCOPE,
                projectId: task && task.p ? task.p.id : "",
                projectName: task && task.p ? task.p.name : "",
                taskId: task && task.t ? task.t.id : "",
                taskTitle: task && task.t ? task.t.title : "",
            };
        }

        function saveFocusState() {
            try { localStorage.setItem(FOCUS_KEY, JSON.stringify(focusSnapshot())); } catch (e) { }
        }

        function clearFocusState() {
            PENDING_FOCUS = null;
            try { localStorage.removeItem(FOCUS_KEY); } catch (e) { }
        }

        function focusLabelFromState(s) {
            if (!s) return "Nothing selected";
            if (s.scope === "project" && s.projectName) return `${s.projectName} · whole project`;
            if (s.taskTitle && s.projectName) return `${s.taskTitle} · ${s.projectName}`;
            if (s.projectName) return `${s.projectName} · whole project`;
            return "Nothing selected";
        }

        function updateFocusUi() {
            const doc = focusDoc();
            const clock = doc.getElementById("clock");
            if (clock) clock.textContent = fmt(left);
            const phaseEl = doc.getElementById("phase");
            if (phaseEl) phaseEl.textContent = `${phaseName(phase)} · ${tick ? "running" : (left < LEN ? "paused" : "ready")}`;
            const sessionsEl = doc.getElementById("sessions");
            if (sessionsEl) {
                const next = phase === "work"
                    ? `Next break in ${fmt(left)}`
                    : `Back to work in ${fmt(left)}`;
                sessionsEl.textContent = `${sessions} work session${sessions === 1 ? "" : "s"} complete · ${next}`;
            }
            const scopeEl = doc.getElementById("scope");
            if (scopeEl) scopeEl.textContent = FOCUS_SCOPE === "project" ? "Project focus" : "Task focus";
            const scopeBtn = doc.getElementById("projfocus");
            if (scopeBtn) scopeBtn.textContent = FOCUS_SCOPE === "project" ? "Switch to task" : "Project";
            const go = doc.getElementById("go");
            if (go) go.textContent = tick ? "Pause" : (left < LEN ? "Resume" : "Start");
            const lunch = doc.getElementById("lunch");
            if (lunch) lunch.textContent = "Lunch";
        }

        function advancePhase() {
            if (phase === "work") {
                sessions += 1;
                phase = sessions % WORKS_PER_LUNCH === 0 ? "lunch" : "break";
            } else {
                phase = "work";
            }
            LEN = phaseLen(phase);
            left = LEN;
            warned1m = false;
            doneChime();
            updateFocusUi();
            saveFocusState();
        }

        function tickStep() {
            if (left > 0) {
                left -= 1;
                if (!warned1m && left === 60) {
                    warned1m = true;
                    warnChime();
                }
            }
            if (left <= 0) {
                advancePhase();
                return;
            }
            updateFocusUi();
            saveFocusState();
        }

        function startTicker() {
            if (tick) return;
            tick = setInterval(tickStep, 1000);
            updateFocusUi();
            saveFocusState();
        }

        function stopTicker() {
            if (tick) clearInterval(tick);
            tick = null;
            updateFocusUi();
            saveFocusState();
        }

        function setManualPhase(kind) {
            phase = kind;
            LEN = phaseLen(kind);
            left = LEN;
            warned1m = false;
            updateFocusUi();
            saveFocusState();
        }

        function recordFocusedTask(id) {
            const p = task && task.p ? task.p.id : SEL;
            if (!p || !id) return;
            LAST_TASK_BY_PROJECT[p] = id;
            try { localStorage.setItem(LAST_TASK_KEY, JSON.stringify(LAST_TASK_BY_PROJECT)); } catch (e) { }
        }

        function applyFocusState(s, started = false) {
            PENDING_FOCUS = s || null;
            if (!s) return;
            FOCUS_SCOPE = s.scope === "project" ? "project" : "task";
            phase = s.phase || "work";
            sessions = typeof s.sessions === "number" ? s.sessions : 0;
            LEN = typeof s.len === "number" ? s.len : phaseLen(phase);
            warned1m = !!s.warned1m;
            let remaining = s.running ? (s.left ?? LEN) - Math.floor((Date.now() - (s.savedAt || Date.now())) / 1000) : (s.left ?? LEN);
            while (remaining <= 0) {
                if (phase === "work") {
                    sessions += 1;
                    phase = sessions % WORKS_PER_LUNCH === 0 ? "lunch" : "break";
                } else {
                    phase = "work";
                }
                LEN = phaseLen(phase);
                remaining += LEN;
                warned1m = false;
            }
            left = Math.max(0, remaining);
            const p = { id: s.projectId || "", name: s.projectName || "" };
            const t = FOCUS_SCOPE === "project"
                ? { id: "", title: s.projectName || "" }
                : { id: s.taskId || "", title: s.taskTitle || s.projectName || "" };
            task = {
                p,
                t
            };
            const doc = focusDoc();
            const ctx = doc.getElementById("ctx");
            if (ctx) ctx.textContent = focusLabelFromState(s);
            updateFocusUi();
            if (started && s.running) startTicker();
        }

        function restoreFocusState() {
            try {
                const s = JSON.parse(localStorage.getItem(FOCUS_KEY) || "null");
                if (s) applyFocusState(s, true);
            } catch (e) { }
        }

        function hydrateFocusFromBoard() {
            if (!PENDING_FOCUS || !BOARD || !BOARD.projects) return;
            const p = BOARD.projects.find(x => x.id === PENDING_FOCUS.projectId);
            if (!p) return;
            SEL = p.id;
            const t = FOCUS_SCOPE === "project" ? null : (PENDING_FOCUS.taskId ? (p.tasks || []).find(x => x.id === PENDING_FOCUS.taskId) : null);
            task = { p, t: t || { id: "", title: p.name } };
            if (focusDoc().getElementById("ctx")) focusDoc().getElementById("ctx").textContent =
                FOCUS_SCOPE === "project" ? `${p.name} · whole project` : (t ? `${t.title} · ${p.name}` : `${p.name} · whole project`);
            drawRail();
            draw();
            drawCandidates();
            if (FILE) drawPrev();
        }

        function drawCandidates() {
            const out = [];
            BOARD.projects.slice(0, 3).forEach(p => {
                /* Never offer a task that is waiting on a sibling. A candidate you cannot
                   start is worse than no candidate: it costs a decision and returns nothing. */
                const openIds = new Set(p.tasks.filter(x => x.status === "open" || x.status === "doing").map(x => x.id));
                const t = p.tasks.find(x => (x.status === "open" || x.status === "doing")
                    && !(x.blocked_by || []).some(d => openIds.has(d)));
                if (t) out.push({ p, t });
            });
            const doc = focusDoc();
            const box = doc.getElementById("cands");
            if (!box) return;
            box.innerHTML = out.length ? out.map((c, i) => `
    <div class="cand" onclick="setTask(${i})">
      <div class="t">${c.t.title}</div>
      <div class="r">${c.p.name} · ${c.p.why[0] || "ranked highest"}</div>
    </div>`).join("") : `<div class="why">No open tasks to offer.</div>`;
            window._CANDS = out;
        }
        function setTask(i) {
            const c = window._CANDS[i]; task = c;
            FOCUS_SCOPE = "task";
            recordFocusedTask(c.p.id, c.t.id);
            const doc = focusDoc();
            doc.getElementById("ctx").textContent = c.t.title + " · " + c.p.name;
            if (FILE) drawPrev();
            if (c.p.id !== SEL) pick(c.p.id);
            saveFocusState();
        }

        /* Focus anything, not only what was offered.
           The three candidates are a suggestion from the ranking, and the
           ranking does not know what you were just asked to do in a corridor.
           A timer you cannot point at the real thing gets used once. */
        function focusTask(id) {
            const p = proj(SEL);
            const t = (p.tasks || []).find(x => x.id === id);
            if (!t) return;
            FOCUS_SCOPE = "task";
            task = { p, t };
            recordFocusedTask(p.id, t.id);
            const doc = focusDoc();
            doc.getElementById("ctx").textContent = t.title + " · " + p.name;
            doc.getElementById("cands").innerHTML =
                `<div class="why">Focused by hand. <span class="lnk" onclick="drawCandidates()">Show suggestions</span></div>`;
            if (FILE) drawPrev();
            saveFocusState();
        }

        /* A project rather than a task, for work that has no card yet. Captures
           file under the project with no task id, which is honest: it says the
           hour went here without inventing a task to hang it on. */
        function focusProject() {
            const p = proj(SEL);
            if (!p) return;
            FOCUS_SCOPE = "project";
            task = { p, t: { id: "", title: p.name } };
            const doc = focusDoc();
            doc.getElementById("ctx").textContent = p.name + " · whole project";
            doc.getElementById("cands").innerHTML =
                `<div class="why">Focused by hand. <span class="lnk" onclick="drawCandidates()">Show suggestions</span></div>`;
            if (FILE) drawPrev();
            saveFocusState();
        }

        function toggleFocusScope() {
            const p = proj(SEL);
            if (!p) return;
            if (FOCUS_SCOPE === "project") {
                const saved = LAST_TASK_BY_PROJECT[p.id];
                const next = saved || (p.tasks || []).find(x => x.status === "open" || x.status === "doing");
                if (next) {
                    focusTask(next.id);
                    return;
                }
                return;
            }
            focusProject();
        }

        function fmt(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
        function paint() { updateFocusUi(); }
        document.getElementById("go").onclick = async () => {
            const doc = focusDoc();
            const b = doc.getElementById("go");
            if (!b) return;
            if (tick) { stopTicker(); return; }
            await armAudio();
            startTicker();
        };
        document.getElementById("lunch").onclick = async () => {
            await armAudio();
            setManualPhase("lunch");
            if (!tick) startTicker();
        };
        document.getElementById("projfocus").onclick = () => {
            toggleFocusScope();
        };
        document.getElementById("reset").onclick = () => {
            const doc = focusDoc();
            if (tick) clearInterval(tick); tick = null; phase = "work"; sessions = 0; LEN = WORK_LEN; left = LEN; warned1m = false; updateFocusUi();
            const b = doc.getElementById("go");
            if (b) b.textContent = "Start";
            clearFocusState();
        };
        document.getElementById("fold").onclick = () => {
            const f = document.getElementById("focus");
            f.classList.toggle("collapsed");
            document.getElementById("fold").textContent = f.classList.contains("collapsed") ? "+" : "-";
        };

/* ---- moving the focus panel ----
           It floats over the page, so wherever it is parked it is in front of
           something. Three answers, in order of how far you want it to go:
           drag it, pop it into its own always-on-top window, or put it back.

           Dragging writes left and top and clears the bottom anchor, because a
           panel pinned to two opposite edges cannot move. The spot is saved,
           and clamped on load, so a panel dragged to a corner of a wide display
           does not come back off-screen on a laptop. */
        const SPOT_KEY = "hiveframe.focusspot";

        function placeFocus(x, y) {
            const f = focusNode();
            if (!f) return { x: 0, y: 0 };
            const w = f.offsetWidth || 274, h = f.offsetHeight || 200;
            x = Math.min(Math.max(0, x), Math.max(0, innerWidth - w));
            y = Math.min(Math.max(0, y), Math.max(0, innerHeight - h));
            f.style.left = x + "px";
            f.style.top = y + "px";
            f.style.bottom = "auto";
            return { x, y };
        }

        function loadSpot() {
            try {
                const s = JSON.parse(localStorage.getItem(SPOT_KEY) || "null");
                if (s) placeFocus(s.x, s.y);
            } catch (e) { }
        }

        function homeFocus() {
            const f = focusNode();
            if (!f) return;
            f.style.left = "16px"; f.style.top = "auto"; f.style.bottom = "16px";
            try { localStorage.removeItem(SPOT_KEY); } catch (e) { }
        }
        document.getElementById("fhome").onclick = homeFocus;

        document.getElementById("fdrag").addEventListener("pointerdown", ev => {
            /* Not from a button. The header carries three of them. */
            if (ev.target.closest("button")) return;
            const f = focusNode();
            if (!f) return;
            const g = ev.currentTarget;
            const r = f.getBoundingClientRect();
            const dx = ev.clientX - r.left, dy = ev.clientY - r.top;
            g.classList.add("dragging");
            g.setPointerCapture(ev.pointerId);
            const move = e => placeFocus(e.clientX - dx, e.clientY - dy);
            const up = e => {
                g.releasePointerCapture(ev.pointerId);
                g.classList.remove("dragging");
                g.removeEventListener("pointermove", move);
                g.removeEventListener("pointerup", up);
                const at = placeFocus(e.clientX - dx, e.clientY - dy);
                try { localStorage.setItem(SPOT_KEY, JSON.stringify(at)); } catch (e2) { }
            };
            g.addEventListener("pointermove", move);
            g.addEventListener("pointerup", up);
            ev.preventDefault();
        });

        /* Pop out moves the node itself into a document picture-in-picture
           window, which floats above other applications. The node moves rather
           than being copied, so the timer keeps running and every handler keeps
           working; a copy would need its own state and the two would drift.
           Closing the window moves it straight back.

           Feature-detected. Where the browser does not support it the button is
           removed rather than left to fail on click. */
        async function popFocus() {
            if (!window.documentPictureInPicture) return;
            const f = focusNode();
            if (!f) return;
            const w = await documentPictureInPicture.requestWindow({ width: 300, height: 420 });
            [...document.styleSheets].forEach(ss => {
                try {
                    const css = [...ss.cssRules].map(r => r.cssText).join("");
                    const el = w.document.createElement("style");
                    el.textContent = css;
                    w.document.head.appendChild(el);
                } catch (e) { /* cross-origin sheet, nothing to copy */ }
            });
            w.document.body.classList.add("pip");
            w.document.body.appendChild(f);
            FOCUS = f;
            w.addEventListener("pagehide", () => {
                document.body.appendChild(f);
                FOCUS = f;
                homeFocus();
                loadSpot();
            });
        }

        if (window.documentPictureInPicture) document.getElementById("fpop").onclick = popFocus;
        else document.getElementById("fpop").remove();

        loadSpot();
        /* A window resized smaller can leave the panel outside it. */
        addEventListener("resize", loadSpot);
        document.addEventListener("paste", handlePasteImport);
        document.getElementById("capture").addEventListener("keydown", async e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                const v = e.target.value.trim(); if (!v) return;
                /* Persist it. A capture box that discards what you typed teaches you not
                   to use it, and then the thought goes back into working memory. */
                const r = await fetch("/api/capture", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: v, store: "work",
                        project: task ? task.p.id : "", task: task ? task.t.id : ""
                    })
                });
                if (!r.ok) { e.target.placeholder = "Not saved. Try again."; return; }
                e.target.value = ""; e.target.placeholder = "Parked in inbox.jsonl. Keep going.";
                setTimeout(() => e.target.placeholder = "Park the thought here", 2500);
            }
        });

        document.querySelectorAll(".tab[data-v]").forEach(b => b.onclick = () => setView(b.dataset.v));

        document.getElementById("ftreerefresh").onclick = () => { if (SEL) loadTree(SEL, true); };

        /* ---- message box height ----
           A three-line box is right for a question and wrong for a drafted task
           instruction, which is the thing the Ask button now puts in it. Dragged
           up, not auto-grown: an input that resizes itself while you type moves
           the text under the cursor.

           Height is saved, and clamped on load, so a box dragged tall on a big
           display does not swallow the conversation on a laptop. */
        const CBOX_KEY = "hiveframe.promptheight";
        const CBOX_MIN = 54;

        function setPromptH(px) {
            const box = document.getElementById("cprompt");
            const max = Math.max(CBOX_MIN, innerHeight - 260);
            const h = Math.min(max, Math.max(CBOX_MIN, px));
            box.style.height = h + "px";
            return h;
        }

        try {
            const s = parseInt(localStorage.getItem(CBOX_KEY) || "", 10);
            if (s) setPromptH(s);
        } catch (e) { }

        document.getElementById("cgrip").addEventListener("pointerdown", ev => {
            const g = ev.currentTarget;
            const box = document.getElementById("cprompt");
            const start = ev.clientY;
            const from = box.getBoundingClientRect().height;
            g.classList.add("dragging");
            document.body.classList.add("rowdrag");
            g.setPointerCapture(ev.pointerId);
            /* Up is bigger, because the box grows against the conversation
               above it rather than off the bottom of the window. */
            const move = e => setPromptH(from - (e.clientY - start));
            const up = e => {
                g.releasePointerCapture(ev.pointerId);
                g.classList.remove("dragging");
                document.body.classList.remove("rowdrag");
                g.removeEventListener("pointermove", move);
                g.removeEventListener("pointerup", up);
                const h = setPromptH(from - (e.clientY - start));
                try { localStorage.setItem(CBOX_KEY, String(h)); } catch (e2) { }
            };
            g.addEventListener("pointermove", move);
            g.addEventListener("pointerup", up);
            ev.preventDefault();
        });


        document.getElementById("fhist").onchange = e => {
            const p = e.target.value;
            e.target.value = "";
            if (p) openFile(p);
        };


        /* Chat controls are bound once, because the rail is markup rather than a
           re-rendered string. That is most of the reason it is a rail. */
        document.getElementById("csend").onclick = sendChat;
        document.getElementById("cstop").onclick = stopChat;
        document.getElementById("cprompt").addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });
        /* Clearing ends the thread when the subject has moved on.

           It was built as a cost control. The turn log does not support that:
           over 106 turns, per-turn cost tracked duration (r=+0.58) far more
           than thread depth (r=+0.21). Kept because a thread about one thing is
           a bad place to ask about another, which is a reason that stands on
           its own. TURNS is emptied so the credit figure describes the thread
           it is counting. */
        document.getElementById("cnew").onclick = async () => {
            if (RUN) return;
            const r = await fetch("/api/chat/clear", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ store: "work", project: SEL || "" })
            }).then(x => x.json()).catch(() => ({}));
            if (CHAT) CHAT.session = "";
            TURNS = [];
            clearChatAttach();
            const kept = r && r.archived
                ? ` The transcript is kept as <code>${r.archived}</code>.`
                : "";
            document.getElementById("cscroll").innerHTML =
                `<p class="empty">Cleared. The next question is sent on its own.${kept}</p>`;
            paintCtx();
        };
        document.getElementById("chattoggle").onclick = () => {
            document.querySelector(".app").classList.toggle("nochat");
            saveLayout();
        };

        /* ---- resizable panels ----
           Column widths live in CSS variables, so a drag writes one property
           and the browser does the rest. They are saved, because a layout you
           have to rebuild every morning is one you stop adjusting.

           Minimums are enforced here rather than in CSS: a panel dragged to
           40px is not a small panel, it is a panel you have lost, and the
           handle to recover it is 40px wide. */
        const LAYOUT_KEY = "hiveframe.layout";
        const LIMITS = { rail: [200, 460], prev: [320, 1100], chat: [300, 720] };
        let LAYOUT = { rail: 290, prev: 560, chat: 380, chatOpen: true };

        function applyLayout() {
            const app = document.getElementById("app");
            app.style.setProperty("--w-rail", LAYOUT.rail + "px");
            app.style.setProperty("--w-chat", LAYOUT.chat + "px");
            if (!app.classList.contains("noprev"))
                app.style.setProperty("--w-prev", LAYOUT.prev + "px");
            app.classList.toggle("nochat", !LAYOUT.chatOpen);
        }

        function saveLayout() {
            LAYOUT.chatOpen = !document.getElementById("app").classList.contains("nochat");
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(LAYOUT)); } catch (e) { }
        }

        function loadLayout() {
            try {
                const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
                ["rail", "prev", "chat"].forEach(k => {
                    if (typeof s[k] === "number") {
                        const [lo, hi] = LIMITS[k];
                        LAYOUT[k] = Math.min(hi, Math.max(lo, s[k]));
                    }
                });
                if (typeof s.chatOpen === "boolean") LAYOUT.chatOpen = s.chatOpen;
            } catch (e) { }
            applyLayout();
        }

        document.querySelectorAll(".gutter").forEach(g => {
            g.addEventListener("pointerdown", ev => {
                const key = g.dataset.drag;
                const app = document.getElementById("app");
                const start = ev.clientX;
                const from = LAYOUT[key];
                /* The rail grows to the right, the other two grow to the left,
                   because they sit on the far side of the handle. */
                const dir = key === "rail" ? 1 : -1;
                const [lo, hi] = LIMITS[key];

                g.classList.add("dragging");
                document.body.classList.add("dragging");
                g.setPointerCapture(ev.pointerId);

                const move = e => {
                    const w = Math.min(hi, Math.max(lo, from + dir * (e.clientX - start)));
                    LAYOUT[key] = w;
                    app.style.setProperty("--w-" + key, w + "px");
                };
                const up = e => {
                    g.releasePointerCapture(ev.pointerId);
                    g.classList.remove("dragging");
                    document.body.classList.remove("dragging");
                    g.removeEventListener("pointermove", move);
                    g.removeEventListener("pointerup", up);
                    saveLayout();
                };
                g.addEventListener("pointermove", move);
                g.addEventListener("pointerup", up);
                ev.preventDefault();
            });
        });

        loadLayout();
        restoreFocusState();
        addEventListener("beforeunload", () => { if (tick || PENDING_FOCUS) saveFocusState(); });
        paint(); load(); loadChat();
    </script>
</body>

</html>
